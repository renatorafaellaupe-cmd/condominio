<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#14202B; --muted:#5A6977; --line:#D3DAE1;
  --cell:#1F5A8F; --cell-deep:#15304C; --sun:#E8A317; --sun-ink:#2A1C00;
  --ok:#2E8B57; --bad:#C0392B; --warn:#C9741F;
  --t-prev:#2C6AA3; --t-corr:#D9822B; --t-insp:#138D90; --t-impl:#7A5BC4; --t-emer:#C0392B;
  --c-plan:#2C6AA3; --c-and:#E0A100; --c-val:#7A5BC4; --c-con:#2E8B57;
  --radius:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1720; --surface:#17212B; --surface-2:#1D2935; --ink:#E5ECF2; --muted:#94A5B5; --line:#2B3947;
    --cell:#4F8FCB; --cell-deep:#0C1E31; --sun:#F0B533; --sun-ink:#231700;
    --ok:#4CB37A; --bad:#E2645A; --warn:#E39446;
    --t-prev:#5B9BD5; --t-corr:#E8954A; --t-insp:#33B3B6; --t-impl:#9C80DE; --t-emer:#E2645A;
    --c-plan:#5B9BD5; --c-and:#F0B533; --c-val:#9C80DE; --c-con:#4CB37A;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,h4{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Cabeçalho com textura de fachada (janelas) */
.top{background-color:var(--cell-deep);color:#fff;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:34px 34px;background-position:-1px -1px}
.top-inner{max-width:1560px;margin:0 auto;padding:18px 22px 0}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand svg{flex:none}
.brand h1{font-size:26px;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;color:rgba(255,255,255,.72);font-size:14px}
.brand .grow{flex:1;min-width:200px}
.sync{font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#9fb3c6}
.sync[data-s="online"]::before{background:#5fd18e}.sync[data-s="erro"]::before{background:#ff7b6e}.sync[data-s="conectando"]::before{background:var(--sun)}.sync[data-s="offline"]::before{background:#ffb648}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer;font-weight:600;font-size:14px;padding:7px 12px;border:1px solid rgba(255,255,255,.35);border-radius:6px}
.menu summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);min-width:230px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:5px;cursor:pointer}
.menu .pop button:hover{background:var(--surface-2)}
.menu .pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.tabs{display:flex;gap:2px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(255,255,255,.7);padding:11px 16px 13px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;position:relative;font-family:'Barlow Semi Condensed','Barlow',sans-serif;letter-spacing:.2px}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:4px;background:var(--sun);border-radius:3px 3px 0 0}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:rgba(255,255,255,.16);font-size:12px;line-height:19px;text-align:center}

main{max-width:1560px;margin:0 auto;padding:22px}
.view{display:none}.view.on{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:24px}
.head p{margin:3px 0 0;color:var(--muted);max-width:70ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--cell)}
.btn.primary{background:var(--cell);border-color:var(--cell);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.typed{border-left:4px solid var(--tc)}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel>h3{font-size:17px;padding:14px 16px 0}
.pad{padding:16px}
.muted{color:var(--muted)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;font-family:'Barlow Semi Condensed',sans-serif}
.empty .bar{justify-content:center;margin-top:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor;background:transparent}
.chip.bad{color:var(--bad);border-color:currentColor;background:transparent}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}

/* Tabelas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--muted);font-size:13px}
.acts{white-space:nowrap;text-align:right}

/* Árvore de ativos */
.split{display:grid;grid-template-columns:minmax(320px,480px) 1fr;gap:16px;align-items:start}
.tree-wrap{max-height:calc(100vh - 250px);min-height:300px;overflow:auto;padding:8px 6px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:13px;padding-left:8px;border-left:1px dashed var(--line)}
.node{display:flex;align-items:center;gap:2px;border-radius:6px}
.node.sel{background:color-mix(in srgb,var(--cell) 14%,transparent)}
.caret{width:24px;height:28px;border:0;background:none;cursor:pointer;color:var(--muted);flex:none;font-size:13px}
.node-main{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:5px 6px;cursor:pointer;border-radius:6px;min-width:0}
.node-main:hover{background:var(--surface-2)}
.tree-panel{display:flex;flex-direction:column;min-width:0}
.tree-tools{display:flex;gap:8px;align-items:center;padding:12px 12px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tree-tools .inp{flex:1;min-width:140px}
.tree-panel .tree-wrap{border:0}
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:8px;background:var(--cell);color:#fff;border:0;border-radius:999px;padding:8px 14px 8px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.dd-btn .chev{font-size:11px;opacity:.85}
.dd-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;min-width:250px}
.dd-pop[hidden]{display:none}
.dd-pop button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:15px}
.dd-pop button:hover,.dd-pop button[aria-checked="true"]{background:var(--surface-2)}
.dd-pop button .n{margin-left:auto;color:var(--muted);font-size:13px}
.ki{display:inline-grid;place-items:center;flex:none;color:var(--kc,var(--cell))}
.k-Instalacao{--kc:var(--t-prev)}.k-Equipamento{--kc:var(--t-insp)}.k-Ferramenta{--kc:var(--t-corr)}
.k-PecaSuprimento{--kc:var(--t-impl)}.k-Digital{--kc:var(--muted)}.k-Mapa{--kc:var(--ok)}
.node{align-items:flex-start;border-bottom:1px solid var(--line);border-radius:0;padding:3px 0}
.tree ul{border-left:0;margin-left:16px;padding-left:6px}
.caret{font-size:18px;font-weight:600;color:var(--cell);height:36px}
.node-main{align-items:flex-start;padding:6px 6px}
.node-main .ki{margin-top:1px}
.nmw{display:flex;flex-direction:column;min-width:0;flex:1}
.nml{display:flex;gap:8px;align-items:baseline;min-width:0}
.pth{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.hier{display:flex;gap:4px;flex:none;margin-top:1px}
.hier span{font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;border:1px solid currentColor}
.hier .hp{color:var(--cell)}.hier .hf{color:var(--muted)}
.node .crit{margin-left:6px;margin-top:2px}
.node.ctx .node-main{opacity:.55}
.node-add{flex:none;width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--cell);display:grid;place-items:center;opacity:0;margin-top:4px}
.node:hover .node-add,.node.sel .node-add,.node-add:focus-visible{opacity:1}
.node-add:hover{background:color-mix(in srgb,var(--cell) 12%,transparent)}
@media (hover:none){.node-add{opacity:.7}}
.node-del{margin-top:4px}
.kids{display:flex;flex-direction:column;gap:6px}
.node-del{flex:none;width:28px;height:28px;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;opacity:0}
.node:hover .node-del,.node.sel .node-del,.node-del:focus-visible{opacity:1}
.node-del:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
@media (hover:none){.node-del{opacity:.6}}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger:hover{border-color:var(--bad)}
.tb{flex:none;font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;min-width:34px;text-align:center;padding:1px 4px;border-radius:4px;background:var(--cell);color:#fff}
.tb.u{background:var(--sun);color:var(--sun-ink)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cod{color:var(--muted);font-size:12px;white-space:nowrap}
.crit{margin-left:auto;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none}
.crit.c-A{background:var(--bad);color:#fff}.crit.c-B{background:var(--warn);color:#fff}.crit.c-C{background:var(--line);color:var(--ink)}
.det h3{font-size:22px}
.crumb{color:var(--muted);font-size:13px;margin-top:3px}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px;margin:16px 0}
.attrs div span{display:block;color:var(--muted);font-size:13px}
.attrs div b{font-weight:600}
.sec{margin-top:20px}
.sec h4{font-size:16px;margin-bottom:8px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini button{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--surface-2);padding:8px 10px;border-radius:6px;cursor:pointer;border-left:4px solid var(--tc,var(--line))}

/* PMP */
.cover td,.cover th{text-align:center}
.cover td:first-child,.cover th:first-child{text-align:left}
.cover td.z{color:var(--muted)}
.gen{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0}
.gen label{display:flex;gap:6px;align-items:center;font-size:14px}

/* Kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:300px;border-top:4px solid var(--cc)}
.col header{padding:12px 14px 10px}
.col header h3{font-size:17px;display:flex;justify-content:space-between;gap:8px}
.col header h3 span{font-family:'Barlow',sans-serif;font-size:14px;color:var(--muted);font-weight:600}
.col header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.col .list{padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;max-height:calc(100vh - 290px);overflow-y:auto}
.col.over{outline:2px dashed var(--cc);outline-offset:-4px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:6px;padding:9px 11px;cursor:grab}
.card:hover{border-color:color-mix(in srgb,var(--tc) 60%,var(--line));border-left-color:var(--tc)}
.card.drag{opacity:.45}
.card-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
.tag{font-weight:700;color:var(--tc)}
.orig{color:var(--muted)}
.prio{margin-left:auto;font-weight:700;color:var(--bad)}
.card h4{font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;margin:4px 0 2px}
.path{margin:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:12.5px;color:var(--muted);align-items:center}
.late{color:var(--bad);font-weight:600}
.adv{border:1px solid var(--line);background:var(--surface-2);border-radius:5px;font-size:12px;font-weight:600;padding:2px 8px;cursor:pointer;white-space:nowrap}
.adv:hover{border-color:var(--cc)}
.more{border:1px dashed var(--line);background:none;border-radius:6px;padding:7px;cursor:pointer;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--tc);margin-right:5px;vertical-align:-1px}

/* Cronograma */
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-nav h3{font-size:20px;min-width:180px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dw{font-size:13px;font-weight:600;color:var(--muted);padding:7px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2)}
.day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;background:none;border-top:0;border-left:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:hover{background:var(--surface-2)}
.day.out{background:color-mix(in srgb,var(--surface-2) 60%,transparent);cursor:default}
.day .dn{font-size:13px;font-weight:600}
.day.today .dn{background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:0 7px;align-self:flex-start}
.day.pick{box-shadow:inset 0 0 0 2px var(--cell)}
.ev{font-size:12px;line-height:1.3;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--tc) 16%,transparent);border-left:3px solid var(--tc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.proj{background:none;border:1px dashed var(--tc);border-left-width:3px}
.ev.done{text-decoration:line-through;opacity:.65}
.ev.more{border:0;background:none;color:var(--muted);padding:0 5px}
.daylist{margin-top:16px}

/* Dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi span{color:var(--muted);font-size:14px}
.kpi b{display:block;font-family:'Barlow Semi Condensed',sans-serif;font-size:34px;line-height:1.1;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:13px}
.kpi.alert b{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chartbox{position:relative;height:290px;padding:10px 14px 14px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,16,26,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:10px;width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(860px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mh h3{font-size:20px}
.x{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.form .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 18px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.fld>span{font-weight:600}
.fld.full{grid-column:1/-1}
.fld[hidden]{display:none}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld small{color:var(--muted)}
.checks{border:1px solid var(--line);border-radius:6px;max-height:190px;overflow:auto;padding:6px 10px}
.checks label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px}
.nota{margin:12px 18px 0;padding:10px 12px;background:var(--surface-2);border-radius:6px;font-size:14px;color:var(--muted)}
.erro{color:var(--bad);margin:0 18px;font-weight:600;min-height:0}
.erro:empty{display:none}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.tdet{padding:16px 18px}
.tdet .attrs{margin:0 0 14px}
.tdet .txt{white-space:pre-wrap;background:var(--surface-2);border-radius:6px;padding:10px 12px;margin:4px 0 12px;font-size:14px}
.hist{list-style:none;margin:6px 0 0;padding:0;border-left:2px solid var(--line)}
.hist li{padding:4px 0 8px 14px;position:relative;font-size:14px}
.hist li::before{content:"";position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--cell)}
.hist time{color:var(--muted);font-size:13px;display:block}
.status-pill{display:inline-block;font-weight:700;font-size:13px;padding:2px 10px;border-radius:10px;color:#fff;background:var(--cc)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}

/* Estrutura padrão */
.ep{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);max-height:52vh;overflow:auto}
.ep-sis{padding:8px 12px;border-bottom:1px solid var(--line)}
.ep-sis:last-child{border-bottom:0}
.ep-sis>ul{list-style:none;margin:4px 0 0 26px;padding:0 0 0 10px;border-left:1px dashed var(--line)}
.ep-l{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;font-size:14px}
.ep-l .ki svg{width:15px;height:15px}
.ep-st{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:9px;margin-left:6px;white-space:nowrap}
.ep-st.novo{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.ep-st.ex{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* Mapa */
.map-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
#mapBox{height:calc(100vh - 270px);min-height:440px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:var(--surface-2)}
#mapBox.posicionando{cursor:crosshair}
#mapBox.posicionando .leaflet-container{cursor:crosshair}
.map-side{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 270px);overflow:auto}
.map-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;gap:10px}
.map-item.ativo{border-color:var(--cell);box-shadow:0 0 0 1px var(--cell)}
.map-thumb{width:64px;height:64px;border-radius:8px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.map-item h4{font-size:16px}
.map-item .bar{gap:6px;margin-top:6px}
.map-aviso{padding:10px 14px;border-radius:var(--radius);background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:1px solid var(--sun);font-weight:600;margin-bottom:12px}
.mk-icon{background:none;border:0}
.mk{width:230px;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.mk-pic{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:#1F5A8F;box-shadow:0 3px 10px rgba(0,0,0,.4);overflow:hidden;display:grid;place-items:center;color:#fff}
.mk-pic img{width:100%;height:100%;object-fit:cover;display:block}
.leaflet-container .leaflet-marker-pane .mk-pic img{width:100%!important;height:100%!important;max-width:none!important;object-fit:cover}
.mk-tip{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:10px solid #fff;margin-top:-1px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.mk-nm{margin-top:3px;background:rgba(21,48,76,.94);color:#fff;font:600 12.5px 'Barlow',system-ui,sans-serif;padding:2px 9px;border-radius:10px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mpop{font-family:'Barlow',system-ui,sans-serif;width:240px}
.mpop img{width:100%;height:140px;object-fit:cover;border-radius:6px;display:block;margin-bottom:8px}
.mpop h4{font-family:'Barlow Semi Condensed',sans-serif;font-size:17px;margin:0 0 2px}
.mpop p{margin:2px 0;color:#5A6977;font-size:13px}
.mpop button{margin-top:8px;border:0;background:#1F5A8F;color:#fff;border-radius:5px;padding:6px 10px;font-weight:600;cursor:pointer}
/* Fotos do ativo */
.fotos-at{display:flex;gap:10px;flex-wrap:wrap}
.foto-at{position:relative;width:132px}
.foto-at img{width:132px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block}
.foto-at.capa img{outline:3px solid var(--sun);outline-offset:-3px}
.foto-at .bar{gap:4px;margin-top:4px}
.foto-at .btn{padding:3px 7px;font-size:12px}
.capa-tag{position:absolute;top:4px;left:4px;background:var(--sun);color:var(--sun-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px}
.zoom-ov img{max-width:100%;max-height:80vh;display:block;margin:0 auto;border-radius:6px}
@media (max-width:980px){.map-layout{grid-template-columns:1fr}.map-side{max-height:none}#mapBox{height:60vh}}
/* Solicitações */
.sol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.pill{display:inline-block;font-weight:700;font-size:12.5px;padding:2px 10px;border-radius:10px;color:#fff;background:var(--cc);white-space:nowrap}
.urg-Urgente{color:var(--bad);font-weight:700}.urg-Alta{color:var(--warn);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.thumbs img.big{width:100%;height:auto;max-height:70vh;object-fit:contain;cursor:zoom-out}
.tw td b{white-space:nowrap}
a.btn{text-decoration:none;display:inline-block}
.linkbtn{border:0;background:none;color:var(--cell);font-weight:600;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.morador-wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.morador-wrap .form .grid{padding:16px 18px 4px}
.protocolo{font-family:'Barlow Semi Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--cell);letter-spacing:.5px}
body.morador .tabs,body.morador #menuDados,body.morador #sync,body.morador .usr-box{display:none}
/* Acesso: login e perfis */
.usr-box{display:flex;align-items:center;gap:8px;font-size:13px}
.usr-box b{font-weight:600}
.usr-box .perfil{padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.14);font-size:12px}
.btn-sair{background:none;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn-sair:hover{background:rgba(255,255,255,.1)}
body.bloqueado .tabs,body.bloqueado main>.view{display:none!important}
.login-wrap{max-width:420px;margin:40px auto}
.login-wrap .form .grid{grid-template-columns:1fr;padding:16px 18px 4px}
.login-wrap .acoes{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 18px 18px}
.login-wrap .msg{margin:0 18px 12px;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:14px}
.login-wrap .msg:empty{display:none}
body.perfil-operador [data-act="novoAtivo"],body.perfil-operador [data-act="novoFilho"],body.perfil-operador [data-act="editarAtivo"],body.perfil-operador [data-act="excluirAtivo"],
body.perfil-operador [data-act="excluirTodosAtivos"],body.perfil-operador [data-act="estruturaPadrao"],body.perfil-operador [data-act="exemplo"],
body.perfil-operador [data-act="fotoAdd"],body.perfil-operador [data-act="fotoCapa"],body.perfil-operador [data-act="fotoRemover"],
body.perfil-operador [data-act="mapaPosicionar"],body.perfil-operador [data-act="mapaCep"],body.perfil-operador [data-act="mapaGps"],body.perfil-operador [data-act="mapaBuscar"],body.perfil-operador [data-act="novoPmp"],body.perfil-operador [data-act="editarPmp"],
body.perfil-operador [data-act="excluirPmp"],body.perfil-operador [data-act="pmpSelecionar"],body.perfil-operador [data-act="pmpExcluirSel"],body.perfil-operador [data-act="modelosPmp"],body.perfil-operador [data-act="excluirTodoPmp"],body.perfil-operador [data-act="gerar"],
body.perfil-operador [data-act="novoForn"],body.perfil-operador [data-act="editarForn"],body.perfil-operador [data-act="excluirForn"],
body.perfil-operador [data-act="editarSol"],body.perfil-operador [data-act="gerarOS"],body.perfil-operador [data-act="solResposta"],
body.perfil-operador [data-act="solAnalise"],body.perfil-operador [data-act="solRecusar"],body.perfil-operador [data-act="solEncerrar"],
body.perfil-operador [data-act="solReabrir"],body.perfil-operador [data-act="excluirSol"],body.perfil-operador [data-act="excluirTarefa"]{display:none!important}
.tab[hidden]{display:none}
/* ===== Cabeçalho fixo + menu lateral ===== */
:root{--hdr:96px;--sbw:272px}
html{scroll-padding-top:calc(var(--hdr) + 12px)}
header.top{position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(8,16,26,.22)}
header.top .top-inner{max-width:none;padding:12px 22px}
.brand h1{font-size:22px}
.brand p{font-size:13px}
.leaflet-container{z-index:0}
.layout{max-width:none;margin:0;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);align-items:start;transition:grid-template-columns .2s ease}
.layout>main{max-width:1560px;width:100%;margin:0 auto;min-width:0;box-sizing:border-box}
.tabs{position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));box-sizing:border-box;margin:0;padding:14px 12px;
  display:flex;flex-direction:column;gap:3px;overflow-y:auto;overflow-x:hidden;background:var(--surface);border:0;border-right:1px solid var(--line);border-radius:0;scrollbar-width:thin}
.nav-tit{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:4px 12px 8px}
.tab{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:8px;border:0;background:none;
  color:var(--muted);font-family:'Barlow',system-ui,sans-serif;font-size:14.5px;font-weight:500;letter-spacing:0;text-align:left;white-space:normal;line-height:1.25;cursor:pointer;transition:background .15s,color .15s}
.tab .ti{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.tab .tl{flex:1;min-width:0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:color-mix(in srgb,var(--cell) 10%,transparent);color:var(--cell);font-weight:700}
.tab[aria-selected="true"] .ti{opacity:1}
.tab[aria-selected="true"]::after{content:none}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--sun)}
.tab .n{flex:none;min-width:22px;padding:0 7px;margin:0;border-radius:11px;background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.tab[aria-selected="true"] .n{background:var(--cell);color:#fff}
.tab .n:empty,.tab .n[data-z="1"]{opacity:.55}
.nav-recolher{margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;border-radius:0}
.nav-recolher:hover{color:var(--ink)}
.nav-recolher .ti{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
/* Menu recolhido: só ícones */
body.menu-recolhido{--sbw:72px}
body.menu-recolhido .tabs{padding:14px 10px}
body.menu-recolhido .nav-tit,body.menu-recolhido .tab .tl,body.menu-recolhido .nav-recolher .tl{display:none}
body.menu-recolhido .tab,body.menu-recolhido .nav-recolher{justify-content:center;padding:11px 0;gap:0}
body.menu-recolhido .tab[aria-selected="true"]::before{left:-10px}
body.menu-recolhido .tab .n{position:absolute;top:3px;right:3px;min-width:16px;padding:0 4px;line-height:16px;font-size:10.5px}
body.menu-recolhido .nav-recolher .ti{transform:rotate(180deg)}
body.bloqueado .layout,body.morador .layout{grid-template-columns:minmax(0,1fr)}
[hidden]{display:none!important}
/* Topo fixo de cada tela (título + botões + filtros) */
main{--mp:22px}
.fixo{position:sticky;top:calc(var(--hdr) + var(--navh,0px));z-index:25;background:var(--bg);margin:calc(-1*var(--mp)) calc(-1*var(--mp)) 16px;padding:14px var(--mp) 12px;border-bottom:1px solid var(--line);box-shadow:0 8px 14px -12px rgba(8,16,26,.35)}
.fixo .head{margin-bottom:0;align-items:center}
.fixo .head h2{margin:0}
.fixo>.bar,.fixo>.gen{margin:12px 0 0!important}
.fixo>.gen{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
/* Modelos de atividades do PMP */
.mod-lista{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);max-height:44vh;overflow:auto}
.mod-lista li{padding:8px 12px;border-bottom:1px solid var(--line)}
.mod-lista li:last-child{border-bottom:0}
.mod-lista label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.mod-lista input{margin-top:3px;width:auto}
.mod-nome{font-weight:600;word-break:break-word}
.mod-lista .muted{font-size:12.5px}
.mod-alvo{margin:0 18px;padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:14px}
/* Norma de referência na tarefa */
.card .ref{margin:4px 0 0;font-size:12px;color:var(--cell);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.normas{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.normas span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--cell) 10%,transparent);color:var(--cell);border:1px solid color-mix(in srgb,var(--cell) 30%,transparent)}
/* Periodicidade no cartão do Kanban */
.per{display:inline-block;margin-left:6px;padding:0 7px;border-radius:9px;font-size:11.5px;font-weight:700;line-height:18px;
  background:color-mix(in srgb,var(--t-prev) 12%,transparent);color:var(--t-prev);border:1px solid color-mix(in srgb,var(--t-prev) 30%,transparent);vertical-align:1px}
/* Equipe executora e anexos da tarefa */
.eq-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 14px;background:var(--surface)}
.eq-op{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.eq-b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 13.5px 'Barlow',system-ui,sans-serif;cursor:pointer}
.eq-b:hover{border-color:var(--cell)}
.eq-b.on{background:var(--cell);border-color:var(--cell);color:#fff}
.anx-lista{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.anx{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);flex-wrap:wrap}
.anx.aprov{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.anx-vazio{justify-content:center;border-style:dashed;background:none;cursor:pointer;font:600 13.5px 'Barlow',system-ui,sans-serif;color:var(--cell);padding:10px}
div.anx-vazio{cursor:default;color:var(--muted);font-weight:500}
.anx-ico{flex:none;width:38px;height:38px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--bad)}
.anx-ico.img{background:var(--cell)}
.anx-info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.anx-info b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anx-info>span{color:var(--muted)}
.anx-dados{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.anx-dados select,.anx-dados input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);font-size:13px}
.anx-dados input{width:130px}
.anx-acts{display:flex;gap:6px;flex-wrap:wrap}
.card .chip-ag{font-size:11px;font-weight:700;padding:0 7px;border-radius:9px;line-height:18px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.card .anx-card{margin:3px 0 0;font-size:12px;color:var(--muted)}
/* Miniatura e visualização de fotos anexadas */
.anx-thumb{position:relative;flex:none;width:96px;height:72px;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0;background:#000;cursor:zoom-in}
.anx-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.anx-thumb .lupa{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.anx-thumb:hover img{opacity:.85}
.btn-lupa{display:inline-flex;align-items:center;gap:5px}
.lightbox{position:fixed;inset:0;z-index:95;background:rgba(5,10,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.lightbox img{max-width:min(1100px,94vw);max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#111}
.lightbox .lb-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:#fff;font-size:14px;max-width:94vw}
.lightbox .lb-bar b{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox .lb-x{position:absolute;top:12px;right:16px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:28px;line-height:1;width:44px;height:44px;border-radius:50%;cursor:pointer}
/* Relatório: galeria de fotos e PDFs */
.rel-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.rel-foto{margin:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface-2);display:flex;flex-direction:column;gap:5px;min-width:0}
.rel-foto .anx-thumb{width:100%;height:100px}
.rel-foto figcaption{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-acts{display:flex;gap:4px;flex-wrap:wrap}
.rel-acts .btn{padding:3px 8px;font-size:12px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.14);color:#fff;font-size:30px;width:48px;height:64px;border-radius:10px;cursor:pointer}
.lb-nav:hover{background:rgba(255,255,255,.25)}
.lb-nav.prev{left:14px}.lb-nav.next{right:14px}
/* QR Code dos ativos */
.qr-det{text-align:center}
.qr-box{width:min(280px,80vw);margin:0 auto;background:#fff;padding:6px;border-radius:10px;border:1px solid var(--line)}
.qr-box svg{display:block;width:100%;height:auto}
.qr-nome{font-weight:700;font-size:17px;margin:10px 0 0}
.qr-cod{margin:2px 0 0;color:var(--muted);font-weight:600}
.qr-url{font-size:12px;word-break:break-all;margin:6px 0 0}
.qt-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.qt-chip{border:1px solid var(--line);border-top:4px solid var(--cc);background:var(--surface);border-radius:10px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 12.5px 'Barlow',system-ui,sans-serif;color:var(--ink)}
.qt-chip b{font-size:22px;line-height:1.1;font-family:'Barlow Semi Condensed',sans-serif}
.qt-filhos{display:flex;gap:8px;align-items:center;font-size:14px;margin:0 0 6px}
.qt-sec{margin-top:14px}
.qt-sec h4{font-size:16px;padding:6px 10px;border-left:4px solid var(--cc);background:var(--surface-2);border-radius:6px;display:flex;justify-content:space-between}
.qt-sec h4 .q{color:var(--muted)}
.qt-it{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--tc);background:var(--surface);border-radius:8px;padding:9px 11px;margin-top:6px;cursor:pointer;font:inherit;color:var(--ink)}
.qt-it:hover{border-color:var(--cell);border-left-color:var(--tc)}
.qt-top{display:flex;gap:8px;align-items:center;font-size:12px}
.qt-top .tag{font-weight:700;color:var(--tc)}
.qt-top .prio{margin-left:auto;font-weight:700;color:var(--bad)}
.qt-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.qt-resumo{grid-template-columns:repeat(2,1fr)}}
#printArea{display:none}
@media print{
  .cartaz{height:270mm;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:Arial,sans-serif;color:#14202B;padding:6mm 10mm;box-sizing:border-box;border:2mm solid #15304C;border-radius:6mm}
  .cz-topo{display:flex;align-items:center;gap:5mm;justify-content:center;margin-bottom:6mm}
  .cz-topo img{max-height:22mm;max-width:40mm;object-fit:contain}
  .cz-topo b{display:block;font-size:15pt;text-transform:uppercase}
  .cz-topo span{display:block;font-size:13pt;color:#15304C;font-weight:700;margin-top:1mm}
  .cartaz h1{font-size:26pt;line-height:1.15;margin:2mm 0 2mm}
  .cz-sub{font-size:15pt;margin:0 0 6mm;color:#333}
  .cz-qr{width:105mm;height:105mm;padding:3mm;border:1mm solid #E8A317;border-radius:4mm}
  .cz-qr svg{width:100%;height:100%;display:block}
  .cz-passos{text-align:left;font-size:13pt;line-height:1.5;margin:7mm auto 4mm;padding-left:8mm;max-width:150mm}
  .cz-alerta{font-size:12pt;font-weight:700;color:#B3261E;margin:2mm 0}
  .cz-url{font-size:8pt;color:#777;margin-top:auto;word-break:break-all}
}
@media print{
  body>*:not(#printArea){display:none!important}
  body{padding:0!important;background:#fff!important}
  #printArea{display:block!important;color:#000}
  @page{size:A4;margin:10mm}
  .etq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm}
  .etq{border:1px dashed #888;border-radius:3mm;padding:3mm;text-align:center;font-family:Arial,sans-serif;break-inside:avoid;display:flex;flex-direction:column;align-items:center;gap:1mm}
  .etq svg{width:40mm;height:40mm}
  .etq b{font-size:10pt;line-height:1.2}
  .etq-cod{font-size:9pt;font-weight:700;color:#333}

}
.cons-it{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--surface)}
/* Seleção de itens do PMP */
.sel-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--cell) 8%,var(--surface));border-radius:var(--radius) var(--radius) 0 0}
.sel-bar b{margin-right:auto}
th.sel,td.sel{width:38px;text-align:center}
td.sel input,th.sel input{width:18px;height:18px;cursor:pointer;accent-color:var(--cell)}
tr.marcada td{background:color-mix(in srgb,var(--cell) 9%,transparent)}
tr.selecionavel{cursor:pointer}
tr.selecionavel:hover td{background:color-mix(in srgb,var(--cell) 5%,transparent)}
.btn-excsel:disabled{opacity:.45;cursor:not-allowed}
/* Sub-áreas do PMP */
.subareas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.sa{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13.5px 'Barlow',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.sa:hover{border-color:var(--cell)}
.sa .q{min-width:20px;padding:0 6px;border-radius:10px;background:var(--surface-2);font-size:12px;line-height:18px;text-align:center}
.sa.vazia{color:var(--muted)}
.sa[aria-selected="true"]{background:var(--cell);border-color:var(--cell);color:#fff}
.sa[aria-selected="true"] .q{background:rgba(255,255,255,.22);color:#fff}
tr.grp td{background:var(--surface-2);font-weight:700;color:var(--cell);padding-top:12px;font-family:'Barlow Semi Condensed','Barlow',sans-serif;font-size:15px}
tr.grp td .muted{font-weight:500;font-family:'Barlow',sans-serif;font-size:13px;margin-left:6px}
.fixo .late{display:inline-block;margin-top:2px;font-size:13.5px}
.tw-fixa{max-height:calc(100vh - var(--hdr) - var(--navh,0px) - var(--fixoh,0px) - 40px);overflow:auto;overscroll-behavior:contain}
.tw-fixa thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);box-shadow:inset 0 -1px 0 var(--line)}
.tw-fixa th{white-space:normal}.tw-fixa th,.tw-fixa td{padding:9px 10px}
/* Localização por CEP / GPS */
.cep-linha{display:flex;gap:8px;align-items:center}
.cep-linha input{flex:1;min-width:0}
.cep-linha .btn{flex:none}
.cep-st{color:var(--muted);min-height:1em}
.cep-st.ok{color:var(--ok)}.cep-st.bad{color:var(--bad)}
.cep-res{background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:14px;margin:0 0 4px}
@media (max-width:640px){
  .brand{flex-wrap:nowrap;gap:10px}
  .brand .grow{min-width:0}
  .brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand p{display:none}
  .sync{font-size:0;padding:7px;gap:0}
  #btnMarca,.usr-box>span{display:none}
  .btn-sair{padding:5px 10px;font-size:13px}
  .logo-img{max-width:48px;max-height:36px}
  .brand svg{width:32px;height:32px}
}
@media (max-width:900px){
  .layout,body.menu-recolhido .layout{grid-template-columns:minmax(0,1fr)}
  .tabs,body.menu-recolhido .tabs{position:sticky;top:var(--hdr);z-index:30;height:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .nav-tit,.nav-recolher{display:none}
  .tab,body.menu-recolhido .tab{width:auto;flex:none;white-space:nowrap;padding:8px 12px;justify-content:flex-start;gap:8px}
  body.menu-recolhido .tab .tl{display:inline}
  body.menu-recolhido .tab .n{position:static}
  .tab[aria-selected="true"]::before{left:10px;right:10px;top:auto;bottom:-8px;width:auto;height:3px;border-radius:3px 3px 0 0}
  header.top .top-inner{padding:10px 14px}
}
/* Logomarca */
.logo-img{max-width:72px;max-height:52px;object-fit:contain;background:#fff;border-radius:6px;padding:3px;flex:none}
body.morador .top-inner{padding-bottom:18px}
@media (max-width:980px){
  .split{grid-template-columns:1fr}
  .tree-wrap{max-height:50vh}
  .charts{grid-template-columns:1fr}
}
@media (max-width:640px){

  .brand h1{font-size:21px}
  .form .grid{grid-template-columns:1fr}
  .day{min-height:64px}

  .day .evc{display:block}
  .kb{grid-template-columns:repeat(4,minmax(250px,86vw))}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{padding-top:env(safe-area-inset-top,0px)}
.nav-mobile,.kb-seg,.sheet-ov{display:none}
@media (max-width:700px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
  .tabs{display:none!important}
  /* barra inferior estilo aplicativo */
  .nav-mobile{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
    background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(8,16,26,.12)}
  body.bloqueado .nav-mobile,body.morador .nav-mobile{display:none}

  .nm-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;color:var(--muted);
    font:600 11px 'Barlow',system-ui,sans-serif;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .nm-b .ti{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nm-b.on{color:var(--cell);background:color-mix(in srgb,var(--cell) 10%,transparent)}
  .nm-n{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;line-height:17px;text-align:center}
  .nm-n:empty,.nm-n[data-z="1"]{display:none}
  /* menu "Mais" */
  .sheet-ov{display:block;position:fixed;inset:0;z-index:80;background:rgba(8,16,26,.5)}

    padding:8px 12px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .sheet .alca{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
  .sheet .s-tit{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:6px 6px}
  .sheet .s-it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:12px 8px;border-radius:10px;font:500 15.5px 'Barlow',system-ui,sans-serif;cursor:pointer}
  .sheet .s-it .ti{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
  .sheet .s-it.on{background:color-mix(in srgb,var(--cell) 10%,transparent);color:var(--cell);font-weight:700}
  .sheet .s-it .n{margin-left:auto;font-size:12px;font-weight:700;background:var(--surface-2);border-radius:10px;padding:0 8px;line-height:20px}
  .sheet .s-sep{height:1px;background:var(--line);margin:8px 0}
  .sheet .s-info{padding:8px;color:var(--muted);font-size:13.5px;line-height:1.45}
  /* cabeçalho compacto */
  header.top .top-inner{padding:8px 12px}
  .brand h1{font-size:16px!important}
  .logo-img{max-width:44px;max-height:34px}
  /* topo de cada tela: deixa de ser fixo para liberar espaço */

  .overlay{z-index:70;padding:0;place-items:stretch}

  .mh{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px}

  .kb-seg{display:flex;gap:4px;margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
  .kb-seg::-webkit-scrollbar{display:none}

  .tw{overflow-x:auto}
  .tw-fixa{max-height:none!important}

function sistemaDoNome(nome){
  const b=norm(nome).replace(/\s+/g,' ').trim();
  const cands=[b,b.replace(/^areas?\s+(de|do|da|dos|das)\s+/,''),b.replace(/^areas?\s+/,''),b.replace(/^sistema\s*·?\s*(de\s+)?/,'')];
  for(let i=0;i<ESTRUTURA_PADRAO.length;i++){const sp=ESTRUTURA_PADRAO[i];const ok=[norm(sp.nome),...sp.alias];if(cands.some(c=>ok.includes(c)))return i;}
  return -1;
}
function prefixoPadrao(c){
  const cod=String(c?.codigo||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(cod&&cod.length<=6)return cod;
  const st=new Set(['de','da','do','das','dos','e']);
  const ini=String(c?.nome||'').split(/\s+/).filter(w=>w&&!st.has(norm(w))).map(w=>norm(w)[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g,'');
  return (ini||'COND').slice(0,6);
}
function aplicarEstrutura(condId,selecao,prefixo,renomear){
  const r={sistemas:0,itens:0,renomeados:0,reaproveitados:0};
  selecao.forEach(({i,itens})=>{
    const sp=ESTRUTURA_PADRAO[i],cat=catSistema(sp);
    let no=S.ativos.find(a=>a.parentId===condId&&(a.tipo===cat||sistemaDoNome(a.nome)===i));
    if(no){
      r.reaproveitados++;
      if(renomear&&no.nome!==sp.nome){no.nome=sp.nome;r.renomeados++;}
      no.tipo=cat;no.classe='Instalação';no.ordem=i+1;if(!no.codigo)no.codigo=`${prefixo}-${sp.sigla}`;if(!no.criticidade)no.criticidade=sp.crit;if(!no.status)no.status='Em operação';
    }else{
      no={id:uid(),nome:sp.nome,tipo:cat,classe:'Instalação',parentId:condId,codigo:`${prefixo}-${sp.sigla}`,criticidade:sp.crit,status:'Em operação',ordem:i+1,fotos:[],fabricante:'',modelo:''};
      S.ativos.push(no);r.sistemas++;
    }
    const ja=new Set(S.ativos.filter(a=>a.parentId===no.id).map(a=>norm(a.nome)));
    itens.forEach(j=>{
      const it=sp.itens[j];if(!it||ja.has(norm(it[0])))return;
      S.ativos.push({id:uid(),nome:it[0],tipo:it[1],classe:CLASSE_DE[it[1]]||'Equipamento',parentId:no.id,codigo:`${prefixo}-${sp.sigla}-${it[2]}`,
        criticidade:it[3]||sp.crit,status:'Em operação',ordem:j+1,fotos:[],fabricante:'',modelo:''});
      r.itens++;
    });
  });
  return r;
}

function addPeriodo(base,p,k){
  const d=parseISO(base);
  if(p.u==='d'){d.setDate(d.getDate()+p.n*k);return iso(d);}
  const dia=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+p.n*k);
  const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(dia,ult));return iso(d);
}

function normalizar(d){

  ['ativos','pmp','tarefas','fornecedores','solicitacoes'].forEach(k=>s[k]=toItens(d[k]));

/* ---------------- Sincronização com o Firebase ----------------
   Cada item fica em <FIREBASE_PATH>/<coleção>/<id>. Só os itens alterados
   são enviados (update), e o que chega do servidor é mesclado item a item
   com o que foi alterado aqui (mescla de 3 vias contra a última versão
   sincronizada). Assim várias pessoas trabalham ao mesmo tempo sem uma
   apagar o trabalho da outra, e as fotos de um ativo só trafegam quando
   aquele ativo muda. Os contadores de protocolo (seqSol, seqOS) usam
   transação para nunca repetir número. */
const COLECOES=['ativos','pmp','tarefas','fornecedores','solicitacoes'];
const BASE_KEY=STORAGE_KEY+'_fbbase';
const FB_ID=FIREBASE_CONFIG?FIREBASE_CONFIG.databaseURL+'/'+FIREBASE_PATH:'';
let fbRef=null, fbBase=null, fbRecebido=false, fbConectado=false, fbErro=false, timerSalvar=null, ordSeq=0, avisoCache=false;
const fbLimpar={};
const ehSeq=k=>/^seq/.test(k);
const hashLongo=new Map();
/* Forma canônica, igual à que o Realtime Database guarda: sem null/undefined,
   sem arrays ou objetos vazios e com as chaves em ordem. Com h=true, textos
   longos (fotos) viram um resumo em cache, para comparar rápido. */
function canon(v,h){
  if(v===null||v===undefined||typeof v==='function')return undefined;
  if(typeof v==='number')return Number.isFinite(v)?v:undefined;
  if(typeof v==='string'){
    if(h&&v.length>1024){let x=hashLongo.get(v);if(!x){if(hashLongo.size>3000)hashLongo.clear();x='#'+hashStr(v);hashLongo.set(v,x);}return x;}
    return v;
  }
  if(typeof v!=='object')return v;
  if(Array.isArray(v)){const a=v.map(x=>canon(x,h)).filter(x=>x!==undefined);return a.length?a:undefined;}
  const o={};Object.keys(v).sort().forEach(k=>{const c=canon(v[k],h);if(c!==undefined)o[k]=c;});
  return Object.keys(o).length?o:undefined;
}
function hashStr(s){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36);
}
const hashDe=v=>hashStr(JSON.stringify(canon(v,true)??null));
const chaveFb=id=>String(id).replace(/[.#$\[\]\/\x00-\x1f\x7f]/g,'_')||'_';
const novoOrd=()=>Date.now()*1000+(ordSeq++%1000);
/* Índice do estado: {coleção:{chave:{h,v}}, config:{campo:{h,v}}}. Garante id e _ord (ordem) em cada item. */
function mapaEstado(st){
  const m={config:{}};
  Object.keys(st.config||{}).forEach(k=>{const v=st.config[k];if(canon(v)!==undefined)m.config[k]={h:hashDe(v),v};});
  COLECOES.forEach(c=>{m[c]={};(st[c]||[]).forEach(x=>{
    if(!x||typeof x!=='object')return;
    if(!x.id)x.id=uid();
    if(x._ord==null||!Number.isFinite(+x._ord))x._ord=novoOrd();
    m[c][chaveFb(x.id)]={h:hashDe(x),v:x};
  });});
  return m;
}
const ordenar=l=>l.sort((a,b)=>(+a._ord||0)-(+b._ord||0));
function persistirLocal(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(S));
    if(fbBase)localStorage.setItem(BASE_KEY,JSON.stringify({id:FB_ID,uid:USER?USER.uid:'',h:fbBase}));else localStorage.removeItem(BASE_KEY);
    if(USER)localStorage.setItem(STORAGE_KEY+'_uid',USER.uid);
    return true;
  }catch(e){
    /* Cópia local e base precisam estar sempre juntas; se não couber, descarta as duas
       e o sistema volta a carregar tudo do Firebase na próxima abertura. */
    try{localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(BASE_KEY);}catch(_){}
    if(!avisoCache){avisoCache=true;toast('O armazenamento do navegador encheu: os dados continuam no Firebase, mas este navegador não terá cópia offline.',true);}
    return false;
  }
}
function salvar(){
  if(!FIREBASE_CONFIG){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));}catch(e){toast('O armazenamento do navegador está cheio. Exporte um backup e remova fotos antigas, ou configure o Firebase.',true);}
    return;
  }
  persistirLocal();
  clearTimeout(timerSalvar);timerSalvar=setTimeout(enviarFirebase,350);
}
function enviarFirebase(){
  clearTimeout(timerSalvar);timerSalvar=null;
  if(!fbRef||!fbRecebido||!USER)return;
  if(!fbBase)fbBase={config:{}};
  const m=mapaEstado(S),upd={},seqs=[],adm=ehAdmin();
  /* O operador só grava tarefas e solicitações, e não exclui. O que ele não pode
     gravar fica só neste navegador e é desfeito pela próxima atualização do servidor. */
  const pode=(c,apagar)=>adm||((c==='tarefas'||c==='solicitacoes')&&!apagar);
  if(adm)Object.keys(fbLimpar).forEach(p=>{upd[p]=null;delete fbLimpar[p];});
  COLECOES.forEach(c=>{
    const b=fbBase[c]||(fbBase[c]={});
    for(const k in m[c])if(b[k]!==m[c][k].h&&pode(c,false)){upd[c+'/'+k]=canon(m[c][k].v,false);b[k]=m[c][k].h;}
    for(const k in b)if(!m[c][k]&&pode(c,true)){upd[c+'/'+k]=null;delete b[k];}
  });
  const bc=fbBase.config||(fbBase.config={});
  for(const k in m.config)if(bc[k]!==m.config[k].h){
    if(ehSeq(k)){seqs.push([k,+m.config[k].v||0]);bc[k]=m.config[k].h;}
    else if(adm){upd['config/'+k]=canon(m.config[k].v,false);bc[k]=m.config[k].h;}
  }
  for(const k in bc)if(!m.config[k]&&adm){if(!ehSeq(k))upd['config/'+k]=null;delete bc[k];}
  enviarPublico();
  persistirLocal();
  /* Envia em lotes de ~4 MB para respeitar o limite de escrita do Realtime Database. */
  let lote={},tam=0;const lotes=[];
  Object.keys(upd).forEach(p=>{
    const t=p.length+(upd[p]===null?4:JSON.stringify(upd[p]).length);
    if(tam&&tam+t>4e6){lotes.push(lote);lote={};tam=0;}
    lote[p]=upd[p];tam+=t;
  });
  if(tam)lotes.push(lote);
  lotes.forEach(l=>fbRef.update(l).then(()=>{if(fbErro){fbErro=false;atualizarSync();}})
    .catch(err=>{fbErro=true;atualizarSync();toast('Não foi possível salvar no Firebase: '+err.message,true);}));
  seqs.forEach(([k,n])=>fbRef.child('config/'+k).transaction(v=>Math.max(+v||0,n)).catch(()=>{}));
}
/* Chave da consulta pública: resumo de protocolo + unidade. Sem os dois, não há como achar o registro. */
const unidNorm=u=>norm(u).replace(/[^a-z0-9]/g,'');
const chaveConsulta=(protocolo,unidade)=>'c'+hashStr(protoNorm(protocolo)+'|'+unidNorm(unidade));
/* Consulta pelo nome: nome + unidade + posição (0, 1, 2…), uma entrada por solicitação da pessoa */
const nomeNorm=n=>norm(n).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const chaveConsultaNome=(nome,unidade,i)=>'c'+hashStr('N|'+nomeNorm(nome)+'|'+unidNorm(unidade)+'|'+i);
const MAX_POR_NOME=20;
function mapaPublico(){
  const m={},mc=S.config.marca;
  if(mc&&(mc.titulo||mc.logo)){m.marca={titulo:String(mc.titulo||MARCA_PADRAO.titulo).slice(0,120),subtitulo:String(mc.subtitulo||'').slice(0,200)};if(fotoOk(mc.logo))m.marca.logo=mc.logo;}
  condominios().forEach(c=>{if(idOk(c.id))m['condominios/'+c.id]={id:c.id,nome:String(c.nome||'Condomínio').slice(0,120)};});
  S.solicitacoes.forEach(x=>{
    if(!x.protocolo||!x.unidade)return;
    const o={protocolo:String(x.protocolo).slice(0,30),status:statusSol(x),criadoEm:String(x.criadoEm||'').slice(0,19)};
    if(x.resposta)o.resposta=String(x.resposta).slice(0,2000);
    m['consulta/'+chaveConsulta(x.protocolo,x.unidade)]=o;
  });
  /* índice por nome: solicitações da mesma pessoa e unidade, da mais antiga para a mais nova */
  const grupos={};
  S.solicitacoes.filter(x=>x.protocolo&&x.unidade&&x.nome).sort((a,b)=>String(a.criadoEm).localeCompare(String(b.criadoEm))).forEach(x=>{
    const g=nomeNorm(x.nome)+'|'+unidNorm(x.unidade);(grupos[g]=grupos[g]||[]).push(x);});
  Object.values(grupos).forEach(l=>l.slice(-MAX_POR_NOME).forEach((x,i)=>{
    const o={protocolo:String(x.protocolo).slice(0,30),status:statusSol(x),criadoEm:String(x.criadoEm||'').slice(0,19)};
    if(x.resposta)o.resposta=String(x.resposta).slice(0,2000);
    m['consulta/'+chaveConsultaNome(x.nome,x.unidade,i)]=o;}));
  return m;
}
function enviarPublico(){
  if(!fbRef||!USER||!fbBase)return;
  const m=mapaPublico(),b=fbBase.pub||(fbBase.pub={}),upd={};
  for(const k in m){const h=hashDe(m[k]);if(b[k]!==h){upd[k]=canon(m[k],false);b[k]=h;}}
  for(const k in b)if(!m[k]){upd[k]=null;delete b[k];}
  if(Object.keys(upd).length)firebase.database().ref(PUB_PATH).update(upd)
    .catch(err=>{Object.keys(upd).forEach(k=>delete b[k]);console.warn('Dados públicos:',err.message);});
}
/* Mescla o que veio do servidor com o estado local. Devolve true se algo mudou na tela. */
function aoReceber(v){
  const raw=v&&typeof v==='object'?v:{};
  const R=normalizar(raw);COLECOES.forEach(c=>ordenar(R[c]));
  const rm=mapaEstado(R),lm=mapaEstado(S),b=fbBase||{config:{}};
  const novo=vazio(),nb={config:{}};let mudou=false;
  COLECOES.forEach(c=>{
    /* Dados gravados no formato antigo (lista) ou com chave diferente do id: regrava por id. */
    const bruto=raw[c],fora=new Set();
    if(bruto&&typeof bruto==='object'){
      Object.keys(bruto).forEach(k=>{const x=bruto[k];if(!x||typeof x!=='object'||!x.id||chaveFb(x.id)!==k){fbLimpar[c+'/'+k]=true;if(x&&x.id)fora.add(chaveFb(x.id));}});
    }
    const bb=b[c]||{},nc=nb[c]={},out=[];
    new Set([...Object.keys(lm[c]),...Object.keys(rm[c])]).forEach(k=>{
      const r=rm[c][k],l=lm[c][k];
      const usarLocal=(r?r.h:undefined)===bb[k];          // servidor não mudou este item desde a última sincronização
      const e=usarLocal?l:r;
      if(!usarLocal&&(r?r.h:undefined)!==(l?l.h:undefined))mudou=true;
      if(e)out.push(e.v);
      if(r&&!fora.has(k))nc[k]=r.h;      // item fora do lugar: fica sem base e é regravado na chave certa
    });
    novo[c]=ordenar(out);
  });
  novo.config={};
  new Set([...Object.keys(lm.config),...Object.keys(rm.config)]).forEach(k=>{
    const r=rm.config[k],l=lm.config[k];
    let val;
    if(ehSeq(k))val=Math.max(r?+r.v||0:0,l?+l.v||0:0);
    else{const usarLocal=(r?r.h:undefined)===(b.config||{})[k];val=(usarLocal?l:r)?.v;if(!usarLocal&&(r?r.h:undefined)!==(l?l.h:undefined))mudou=true;}
    if(val!==undefined)novo.config[k]=val;
    if(r)nb.config[k]=r.h;
  });
  novo.config=Object.assign(vazio().config,novo.config);
  nb.pub=(fbBase&&fbBase.pub)||{};
  S=novo;fbBase=nb;persistirLocal();
  return mudou;
}
function carregarLocal(){
  try{
    /* Com Firebase, a cópia local só vale para o mesmo usuário que a gravou. */
    if(FIREBASE_CONFIG&&(!USER||localStorage.getItem(STORAGE_KEY+'_uid')!==USER.uid)){limparCacheLocal();return;}
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      S=normalizar(JSON.parse(raw));COLECOES.forEach(c=>ordenar(S[c]));
      if(FIREBASE_CONFIG){const bs=JSON.parse(localStorage.getItem(BASE_KEY)||'null');if(bs&&bs.id===FB_ID&&bs.uid===USER.uid&&bs.h)fbBase=bs.h;}
    }
  }catch(e){}
}
function limparCacheLocal(){
  try{[STORAGE_KEY,BASE_KEY,STORAGE_KEY+'_uid',STORAGE_KEY+'_perfil'].forEach(k=>localStorage.removeItem(k));}catch(e){}
}
function setSync(s){
  const el=$('#sync');if(!el)return;el.dataset.s=s;
  el.textContent={local:'Salvo neste navegador',conectando:'Conectando ao Firebase…',online:'Sincronizado com Firebase',offline:'Sem conexão · alterações pendentes',erro:'Erro de sincronização'}[s]||s;
}
function atualizarSync(){
  if(!FIREBASE_CONFIG)return setSync('local');
  if(fbErro)return setSync('erro');
  if(!fbRecebido)return setSync(fbRef&&!fbConectado?'offline':'conectando');
  setSync(fbConectado?'online':'offline');
}
/* Reserva o próximo número de protocolo/OS sem repetir entre usuários. */
async function reservarNumero(chave,prefixo){
  if(fbRef&&fbRecebido&&fbConectado){
    try{
      const r=await Promise.race([
        fbRef.child('config/'+chave).transaction(v=>(+v||0)+1),
        new Promise((_,f)=>setTimeout(()=>f(new Error('tempo esgotado')),6000))
      ]);
      if(r&&r.committed){
        const n=+r.snapshot.val()||0;S.config[chave]=n;
        if(fbBase&&fbBase.config)fbBase.config[chave]=hashDe(n);
        return montarNumero(prefixo,n);
      }
    }catch(e){}
  }
  return proximoNumero(chave,prefixo);
}

function lerLogo(file){
  return new Promise((ok,fail)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,320/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let d=c.toDataURL('image/png');
      if(d.length>300000){const c2=document.createElement('canvas');c2.width=c.width;c2.height=c.height;const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,c2.height);g.drawImage(c,0,0);d=c2.toDataURL('image/jpeg',.85);}
      if(d.length>380000)fail(new Error('Imagem muito grande para a logomarca.'));else ok(d);};
      img.onerror=()=>fail(new Error('Imagem inválida'));img.src=r.result;};
    r.onerror=()=>fail(new Error('Falha ao ler a imagem'));r.readAsDataURL(file);
  });
}

}

/* ---------------- Acesso (Firebase Authentication) ---------------- */
let fbDb=null, fbAuth=null, perfilRef=null, usuariosRef=null, appLiberado=false, USUARIOS={};
function firebasePronto(){
  if(!window.firebase||!firebase.database||!firebase.auth){toast('Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.',true);setSync('erro');return false;}
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  fbDb=firebase.database();fbAuth=firebase.auth();
  return true;
}
function iniciarSync(){
  if(fbRef)return;
  fbRecebido=false;fbErro=false;
  fbRef=fbDb.ref(FIREBASE_PATH);
  let primeiro=true;
  fbRef.on('value',snap=>{
    const mudou=aoReceber(snap.val());
    fbRecebido=true;fbErro=false;atualizarSync();
    enviarFirebase();                       // envia o que só existe aqui (edições offline)
    if(primeiro){primeiro=false;autoGerar();render();}
    else if(mudou)render();
  },err=>{fbErro=true;atualizarSync();toast('Firebase: '+err.message+' — seu usuário pode não ter acesso.',true);});
}
function pararSync(){
  clearTimeout(timerSalvar);timerSalvar=null;
  if(fbRef){fbRef.off();fbRef=null;}
  if(perfilRef){perfilRef.off();perfilRef=null;}
  if(usuariosRef){usuariosRef.off();usuariosRef=null;}
  fbRecebido=false;fbBase=null;USUARIOS={};
}
function mostrarLogin(msg){
  appLiberado=false;aplicarMarca();
  document.body.classList.add('bloqueado');document.body.classList.remove('perfil-operador','perfil-admin','perfil-super_admin');
  $('#usrBox').hidden=true;$('[data-tab="usuarios"]').hidden=true;
  $$('main>.view').forEach(v=>v.classList.remove('on'));
  $('#telaLogin').hidden=false;$('#loginMsg').textContent=msg||'';
  const bt=$('#btnEntrar');bt.disabled=false;bt.textContent='Entrar';
  setTimeout(()=>$('#loginEmail')?.focus(),50);
}
function aplicarPerfil(){
  document.body.classList.remove('perfil-operador','perfil-admin','perfil-super_admin');
  document.body.classList.add('perfil-'+USER.perfil);
  $('#usrNome').textContent=USER.nome||USER.email;$('#usrPerfil').textContent=PERFIS[USER.perfil];$('#usrBox').hidden=false;
  $('[data-tab="usuarios"]').hidden=!ehSuper();aplicarMarca();
  if(ehSuper()&&!usuariosRef){
    usuariosRef=fbDb.ref('usuarios');
    usuariosRef.on('value',s=>{USUARIOS=s.val()||{};if(aba==='usuarios')render();},()=>{});
  }else if(!ehSuper()&&usuariosRef){usuariosRef.off();usuariosRef=null;USUARIOS={};if(aba==='usuarios')trocarAba('kanban');}
}
function liberar(){
  aplicarPerfil();
  if(appLiberado){render();return;}
  appLiberado=true;
  $('#loginMsg').textContent='';$('#telaLogin').hidden=true;document.body.classList.remove('bloqueado');
  S=vazio();carregarLocal();
  let a=(location.hash||'').slice(1);
  if(!RENDER[a]){try{a=sessionStorage.getItem('om_aba')||'';}catch(e){a='';}}
  if(!RENDER[a]||(a==='usuarios'&&!ehSuper()))a=S.ativos.length?'kanban':'ativos';
  trocarAba(a);
  iniciarSync();
}
function negar(msg){
  pararSync();USER=null;limparCacheLocal();S=vazio();
  fbAuth.signOut().catch(()=>{});
  mostrarLogin(msg);
}
function entrou(u){
  if(perfilRef)perfilRef.off();
  /* Perfil guardado deste usuário: permite abrir sem internet. O servidor confirma em seguida. */
  let cache=null;try{cache=JSON.parse(localStorage.getItem(STORAGE_KEY+'_perfil')||'null');}catch(e){}
  if(cache&&cache.uid===u.uid&&PERFIS[cache.perfil]){USER=cache;liberar();}
  else $('#loginMsg').textContent='Verificando o seu acesso…';
  perfilRef=fbDb.ref('usuarios/'+u.uid);
  perfilRef.on('value',snap=>{
    const p=snap.val();
    if(!p||p.ativo!==true||!PERFIS[p.perfil]){negar('Este usuário não tem acesso ativo ao sistema. Procure o administrador.');return;}
    USER={uid:u.uid,email:u.email||p.email||'',nome:p.nome||u.email||'',perfil:p.perfil};
    try{localStorage.setItem(STORAGE_KEY+'_perfil',JSON.stringify(USER));}catch(e){}
    liberar();
  },()=>negar('Este usuário não tem acesso ao sistema. Procure o administrador.'));
}
function msgErroAuth(e){
  const c=e&&e.code||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'E-mail ou senha incorretos.';
  if(/invalid-email/.test(c))return 'E-mail inválido.';
  if(/too-many-requests/.test(c))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/network-request-failed/.test(c))return 'Sem conexão com a internet.';
  if(/user-disabled/.test(c))return 'Este usuário foi desativado.';
  if(/email-already-in-use/.test(c))return 'Já existe uma conta de login com este e-mail no Authentication. Em “Novo usuário”, informe o UID dela no campo “UID existente”.';
  if(/requires-recent-login/.test(c))return 'Por segurança, saia e entre de novo antes de trocar e-mail ou senha.';
  if(/PERMISSION_DENIED|permission/i.test(c+' '+(e&&e.message)))return 'Sem permissão para esta alteração.';
  if(/weak-password/.test(c))return 'Senha fraca: use pelo menos 6 caracteres.';
  if(/operation-not-allowed/.test(c))return 'O login por e-mail e senha não está ativado no Firebase (Authentication → Sign-in method).';
  return (e&&e.message)||'Erro inesperado.';
}
function iniciarAcesso(){
  if(!FIREBASE_CONFIG){USER={uid:'local',nome:'',perfil:'super_admin'};$('[data-tab="usuarios"]').hidden=true;return false;}
  document.body.classList.add('bloqueado');
  if(!firebasePronto()){mostrarLogin('Não foi possível carregar o Firebase. Verifique a internet e recarregue a página.');return true;}
  fbDb.ref('.info/connected').on('value',s=>{fbConectado=!!s.val();atualizarSync();});
  fbDb.ref(PUB_PATH+'/marca').on('value',s=>{MARCA_PUB=s.val();aplicarMarca();},()=>{});
  $('#formLogin').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('#loginEmail').value.trim(),senha=$('#loginSenha').value,msg=$('#loginMsg'),bt=$('#btnEntrar');
    if(!email||!senha){msg.textContent='Informe e-mail e senha.';return;}
    bt.disabled=true;bt.textContent='Entrando…';msg.textContent='';
    try{await fbAuth.signInWithEmailAndPassword(email,senha);$('#loginSenha').value='';}
    catch(err){msg.textContent=msgErroAuth(err);bt.disabled=false;bt.textContent='Entrar';}
  });
  $('#btnEsqueci').addEventListener('click',async()=>{
    const email=$('#loginEmail').value.trim(),msg=$('#loginMsg');
    if(!email){msg.textContent='Digite o seu e-mail no campo acima e clique de novo em “Esqueci minha senha”.';$('#loginEmail').focus();return;}
    try{await fbAuth.sendPasswordResetEmail(email);msg.textContent='Se o e-mail estiver cadastrado, você vai receber um link para criar uma nova senha.';}
    catch(err){msg.textContent=msgErroAuth(err);}
  });
  $('#btnSair').addEventListener('click',async()=>{
    if(timerSalvar)enviarFirebase();
    await new Promise(r=>setTimeout(r,timerSalvar===null&&fbConectado?600:0));
    pararSync();USER=null;limparCacheLocal();S=vazio();$('#loginMsg').textContent='';
    await fbAuth.signOut().catch(()=>{});
  });
  fbAuth.onAuthStateChanged(u=>{
    if(u)entrou(u);
    else{pararSync();USER=null;S=vazio();mostrarLogin($('#loginMsg').textContent);}
  });
  return true;
}

/* ---------------- Usuários (somente super_admin) ----------------
   O que dá para fazer só com o navegador (sem servidor próprio):
   - nome, perfil e situação: alteração direta;
   - e-mail de outra pessoa: cria um novo login com o e-mail novo e transfere
     o cadastro; o login antigo perde o acesso;
   - senha de outra pessoa: o Firebase não deixa definir pelo navegador, então
     o sistema envia um link de redefinição para o e-mail dela;
   - o próprio e-mail e a própria senha: alteração direta (pede a senha atual);
   - excluir: remove o acesso na hora (a conta de login pode ser apagada depois
     em Authentication, no console do Firebase). */
function renderUsuarios(){
  const v=$('#view-usuarios');
  if(!ehSuper()){v.innerHTML='';return;}
  const lista=Object.entries(USUARIOS).map(([uid,u])=>({uid,...(u||{})})).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));

    <div class="bar"><button class="btn primary" data-act="novoUsuario">Novo usuário</button></div></div></div>
    <div class="panel">${lista.length?`<div class="tw"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Desde</th><th></th></tr></thead><tbody>
    ${lista.map(u=>{const eu=u.uid===USER.uid;return `<tr><td><b>${esc(u.nome||'—')}</b>${eu?' <span class="muted">(você)</span>':''}</td><td>${esc(u.email||'—')}</td><td>${esc(PERFIS[u.perfil]||u.perfil||'—')}</td>
      <td>${u.ativo===true?'<span class="pill" style="--cc:var(--ok)">Ativo</span>':'<span class="pill" style="--cc:var(--bad)">Inativo</span>'}</td><td>${fmt(u.criadoEm)}</td>
      <td style="white-space:nowrap"><button class="btn sm" data-act="editarUsuario" data-id="${esc(u.uid)}">Editar</button>${eu?'':` <button class="btn sm danger" data-act="excluirUsuario" data-id="${esc(u.uid)}">Excluir</button>`}</td></tr>`;}).join('')}
    </tbody></table></div>`:'<div class="empty"><strong>Nenhum usuário carregado</strong>Aguarde a conexão com o Firebase.</div>'}</div>`;
}
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v||'');

    {k:'email',l:'E-mail',t:'email',req:true,max:160,valid:v=>v&&!emailOk(v)?'E-mail inválido.':''},

function appCadastro(){
  return firebase.apps.find(a=>a.name==='cadastro')||firebase.initializeApp(FIREBASE_CONFIG,'cadastro');
}
async function criarLogin(email,senha){
  const sec=appCadastro();
  await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
  const cred=await sec.auth().createUserWithEmailAndPassword(email,senha);
  const uidNovo=cred.user.uid;await sec.auth().signOut();
  return uidNovo;
}
async function criarUsuario(v){
  const email=v.email.trim().toLowerCase();let uidNovo=(v.uid||'').trim();
  try{
    if(!uidNovo)uidNovo=await criarLogin(email,v.senha);
    await fbDb.ref('usuarios/'+uidNovo).set({nome:v.nome.trim(),email,perfil:v.perfil,ativo:true,criadoEm:hoje()});
    toast(`Usuário ${v.nome.trim()} criado como ${PERFIS[v.perfil]}`);
  }catch(e){toast(msgErroAuth(e),true);}
}
function editarUsuario(uid){
  const u=USUARIOS[uid];if(!u)return;const proprio=uid===USER.uid;
  const campos=[
    {k:'nome',l:'Nome',req:true,max:120},
    {k:'email',l:'E-mail',t:'email',req:true,max:160,valid:v=>v&&!emailOk(v)?'E-mail inválido.':''},
    {k:'perfil',l:'Perfil',t:'select',opts:Object.entries(PERFIS).map(([v,l])=>({v,l})),dis:proprio,hint:proprio?'Você não pode mudar o próprio perfil.':''},
    {k:'ativo',l:'Situação',t:'select',opts:[{v:'sim',l:'Ativo'},{v:'nao',l:'Inativo (sem acesso)'}],dis:proprio}
  ];

    campos.push(
      {k:'novaSenha',l:'Nova senha',t:'password',hint:'Deixe em branco para manter a senha atual.',valid:v=>v&&v.length<6?'A nova senha precisa ter pelo menos 6 caracteres.':''},
      {k:'novaSenha2',l:'Repita a nova senha',t:'password',valid:(v,o)=>(o.novaSenha||v)&&v!==o.novaSenha?'As senhas não conferem.':''},
      {k:'senhaAtual',l:'Senha atual',t:'password',full:true,hint:'Obrigatória para trocar o seu e-mail ou a sua senha.',
        valid:(v,o)=>!v&&(o.novaSenha||o.email.trim().toLowerCase()!==String(u.email||'').toLowerCase())?'Informe a sua senha atual.':''});
  }else{
    campos.push(
      {k:'acaoSenha',l:'Senha',t:'select',full:true,opts:[{v:'manter',l:'Não alterar'},{v:'link',l:'Enviar link para a pessoa criar uma nova senha'}],
        hint:'Por segurança, o Firebase não permite definir a senha de outra pessoa pelo navegador: ela recebe um link no e-mail.'},
      {k:'senhaNova',l:'Senha provisória do novo e-mail',t:'password',full:true,
        hint:'Só se trocar o e-mail: o sistema cria um novo login com o e-mail novo e esta senha, e o login antigo perde o acesso.',
        valid:(v,o)=>o.email.trim().toLowerCase()!==String(u.email||'').toLowerCase()&&(!v||v.length<6)?'Para trocar o e-mail, informe uma senha provisória com pelo menos 6 caracteres.':''});
  }
  abrirForm({titulo:'Editar usuário',botao:'Salvar',campos,
    dados:{nome:u.nome,email:u.email||'',perfil:u.perfil,ativo:u.ativo===true?'sim':'nao',acaoSenha:'manter'},
    salvar:v=>salvarUsuario(uid,u,v,proprio)});
}
async function salvarUsuario(uid,u,v,proprio){
  const emailNovo=v.email.trim().toLowerCase(),trocouEmail=emailNovo!==String(u.email||'').toLowerCase();
  const reg={nome:v.nome.trim(),email:emailNovo,perfil:proprio?u.perfil:v.perfil,ativo:proprio?true:v.ativo==='sim',criadoEm:u.criadoEm||hoje()};
  try{
    if(proprio){
      if(trocouEmail||v.novaSenha){
        const cu=fbAuth.currentUser;
        await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email,v.senhaAtual));
        if(v.novaSenha)await cu.updatePassword(v.novaSenha);
        if(trocouEmail)await cu.verifyBeforeUpdateEmail(emailNovo);
      }
      await fbDb.ref('usuarios/'+uid).set(reg);
      toast(trocouEmail?`Dados salvos. Abra o link enviado para ${emailNovo} para confirmar o novo e-mail de login.`:(v.novaSenha?'Senha alterada e dados salvos.':'Usuário atualizado'));
      return;
    }
    if(trocouEmail){
      const uidNovo=await criarLogin(emailNovo,v.senhaNova);
      await fbDb.ref('usuarios').update({[uidNovo]:reg,[uid]:null});
      toast(`E-mail alterado: ${reg.nome} agora entra com ${emailNovo} e a senha provisória informada.`);
    }else{
      await fbDb.ref('usuarios/'+uid).set(reg);
      if(v.acaoSenha==='link'&&emailNovo){await fbAuth.sendPasswordResetEmail(emailNovo);toast(`Usuário atualizado e link de nova senha enviado para ${emailNovo}`);}
      else toast('Usuário atualizado');
    }
  }catch(e){toast(msgErroAuth(e),true);}
}
function excluirUsuario(uid){
  const u=USUARIOS[uid];if(!u||uid===USER.uid)return;
  if(!confirm(`Excluir o usuário ${u.nome||u.email}?\n\nEle perde o acesso ao sistema imediatamente. O histórico das tarefas não muda.`))return;
  fbDb.ref('usuarios/'+uid).remove().then(()=>toast('Usuário excluído. Se quiser, apague também a conta em Authentication, no console do Firebase.'))
    .catch(e=>toast('Não foi possível excluir: '+e.message,true));
}

let PUB_CONDS=[], pubCarregado=false;
const comTempo=(p,ms)=>Promise.race([p,new Promise((_,f)=>setTimeout(()=>f(new Error('tempo esgotado')),ms))]);
function iniciarMorador(){
  if(!FIREBASE_CONFIG){render();return;}
  if(!firebasePronto()){pubCarregado=true;render();return;}
  fbDb.ref(PUB_PATH+'/marca').on('value',s=>{MARCA_PUB=s.val();aplicarMarca();},()=>{});
  fbDb.ref(PUB_PATH+'/condominios').on('value',s=>{
    PUB_CONDS=Object.values(s.val()||{}).filter(c=>c&&idOk(c.id)&&c.nome).map(c=>({id:c.id,nome:String(c.nome)}))
      .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR',{numeric:true}));
    if(!pubCarregado){pubCarregado=true;moradorIniciado=false;render();}
  },()=>{pubCarregado=true;moradorIniciado=false;render();});
}
async function registrarSolicitacaoMorador(v){
  const files=[...(v.fotos||[])].slice(0,3);
  const fotos=[];for(const f of files){try{fotos.push(await lerFoto(f));}catch(e){toast(e.message,true);}}
  const r=await comTempo(fbDb.ref(FIREBASE_PATH+'/config/seqSol').transaction(n=>(+n||0)+1),20000);
  if(!r||!r.committed)throw new Error('sem protocolo');
  const n=+r.snapshot.val()||0;
  const protocolo=montarNumero('SOL',n);
  const so={id:uid(),_ord:novoOrd(),protocolo,criadoEm:agora(),status:'aberta',urgencia:'Normal',fotos,
    historico:[{em:agora(),txt:'Registrada pelo morador'}]};
  ['condominioId','unidade','nome','telefone','email','assunto','urgencia','local','descricao'].forEach(k=>{if(v[k]!=null&&v[k]!=='')so[k]=String(v[k]).trim();});
  await comTempo(fbDb.ref(FIREBASE_PATH+'/solicitacoes/'+so.id).set(canon(so,false)),30000);
  await fbDb.ref(PUB_PATH+'/consulta/'+chaveConsulta(protocolo,so.unidade)).set({protocolo,status:'aberta',criadoEm:so.criadoEm}).catch(()=>{});
  if(so.nome)for(let i=0;i<MAX_POR_NOME;i++){
    const ref=fbDb.ref(PUB_PATH+'/consulta/'+chaveConsultaNome(so.nome,so.unidade,i));
    try{const ex=(await comTempo(ref.once('value'),8000)).val();if(ex){if(ex.protocolo===protocolo)break;continue;}
      await ref.set({protocolo,status:'aberta',criadoEm:so.criadoEm});break;}catch(e){break;}
  }
  return so;
}

/* ---------------- Ativos: consultas ---------------- */
const getAtivo = id=>S.ativos.find(a=>a.id===id);
const getForn = id=>S.fornecedores.find(f=>f.id===id);
function mapaFilhos(){
  const m=new Map();
  S.ativos.forEach(a=>{const k=a.parentId&&getAtivo(a.parentId)?a.parentId:'';if(!m.has(k))m.set(k,[]);m.get(k).push(a);});
  m.forEach(l=>l.sort((a,b)=>((+a.ordem||999)-(+b.ordem||999))||String(a.nome).localeCompare(String(b.nome),'pt-BR',{numeric:true})));
  return m;
}
function ancestrais(id){
  const out=[],vistos=new Set();let a=getAtivo(id);
  while(a&&!vistos.has(a.id)){vistos.add(a.id);out.unshift(a);a=a.parentId?getAtivo(a.parentId):null;}
  return out;
}
const caminho = id=>{const a=ancestrais(id);return a.length?a.map(x=>x.nome).join(' › '):'Ativo não encontrado';};
const condId = id=>ancestrais(id)[0]?.id||'';
const condominios = ()=>S.ativos.filter(a=>!a.parentId||!getAtivo(a.parentId)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR',{numeric:true}));
function descendentes(id){
  const m=mapaFilhos(),out=[],pilha=[id];
  while(pilha.length){const c=pilha.pop();(m.get(c)||[]).forEach(f=>{out.push(f.id);pilha.push(f.id);});}
  return out;
}
function opcoesAtivos(){
  return S.ativos.map(a=>({v:a.id,l:caminho(a.id)+(a.codigo?` (${a.codigo})`:'')})).sort((a,b)=>a.l.localeCompare(b.l,'pt-BR',{numeric:true}));
}

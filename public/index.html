/* ---------------- PMP × ativos ---------------- */
function ativosDoPmp(p){
  if(p.ativos&&p.ativos.length) return S.ativos.filter(a=>p.ativos.includes(a.id)&&a.status!=='Inativo');
  return S.ativos.filter(a=>a.tipo===p.tipoAtivo&&a.status!=='Inativo');
}
function ocorrencias(p,de,ate){
  const per=PERIODOS[p.periodicidade];if(!per||!p.dataInicio)return [];
  const out=[];let k=0;
  if(per.u==='d'){const dif=Math.floor((parseISO(de)-parseISO(p.dataInicio))/864e5);if(dif>0)k=Math.floor(dif/per.n);}
  else{const a=parseISO(p.dataInicio),b=parseISO(de);const dm=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(dm>0)k=Math.max(0,Math.floor(dm/per.n)-1);}
  for(let g=0;g<5000;g++,k++){const d=addPeriodo(p.dataInicio,per,k);if(d>ate)break;if(d>=de)out.push(d);}
  return out;
}
const proxima = p=>ocorrencias(p,hoje(),addDias(hoje(),800))[0]||'';
const chave = (pid,aid,d)=>pid+'|'+aid+'|'+d;
const prioPorCrit = c=>({A:'Alta',B:'Média',C:'Baixa'}[c]||'Média');

function novaTarefa(o){
  const t=Object.assign({id:uid(),origem:'Manual',tipo:'Corretiva',titulo:'',ativoId:'',pmpId:'',pmpKey:'',dataPrevista:hoje(),
    responsavel:'',fornecedorId:'',prioridade:'Média',status:'planejada',descricao:'',duracaoH:'',criadoEm:agora(),
    iniciadoEm:'',execFimEm:'',concluidoEm:'',relato:'',executadoPor:'',validadoPor:'',parecer:'',historico:[]},o);
  S.tarefas.push(t);return t;
}
function gerarTarefasPMP(dias,de){
  const ini=de||hoje(),fim=addDias(hoje(),Number(dias)||30);
  const existentes=new Set(S.tarefas.map(t=>t.pmpKey).filter(Boolean));let n=0;
  S.pmp.filter(p=>p.status!=='Inativo').forEach(p=>{
    const ats=ativosDoPmp(p);if(!ats.length)return;
    ocorrencias(p,ini,fim).forEach(d=>ats.forEach(a=>{
      const k=chave(p.id,a.id,d);if(existentes.has(k))return;existentes.add(k);
      novaTarefa({id:'pmp_'+chaveFb(k.replace(/\|/g,'_')),origem:'PMP',tipo:'Preventiva',titulo:p.titulo,ativoId:a.id,pmpId:p.id,pmpKey:k,dataPrevista:d,
        fornecedorId:p.fornecedorId||'',prioridade:prioPorCrit(a.criticidade),descricao:p.procedimento||'',norma:p.norma||'',duracaoH:p.duracaoH||'',
        historico:[{em:agora(),txt:`Gerada pelo PMP (${p.periodicidade})`}]});
      n++;
    }));
  });
  return n;
}
/* Propaga a edição de um item do PMP para as tarefas que ele gerou, para que Kanban,
   Cronograma, Dashboard, árvore de ativos e detalhes mostrem sempre o dado atual.
   - Nome: atualizado em todas as tarefas do item (inclusive concluídas), exceto nas que
     tiveram o título editado individualmente.
   - Procedimento, duração e executor: atualizados nas tarefas ainda não concluídas, também
     respeitando o que foi alterado individualmente na tarefa.
   - Periodicidade, 1ª execução, ativos cobertos ou item inativado: tarefas ainda planejadas
     (não iniciadas) que deixaram de fazer parte da programação são removidas; as novas
     datas são geradas em seguida por gerarTarefasPMP. */
function sincronizarTarefasPmp(p,antes){
  const r={atualizadas:0,removidas:0};if(!p||!antes)return r;
  const cobre=new Set(ativosDoPmp(p).map(a=>a.id));
  const inativo=p.status==='Inativo';
  const mudouAgenda=antes.periodicidade!==p.periodicidade||antes.dataInicio!==p.dataInicio;
  const naAgenda=d=>!!d&&ocorrencias(p,d,d).length>0;
  const igual=(a,b)=>String(a??'')===String(b??'');
  const campos=[['titulo','titulo','nome'],['procedimento','descricao','procedimento'],['norma','norma','norma de referência'],['duracaoH','duracaoH','duração'],['fornecedorId','fornecedorId','executor']];
  const ts=agora();
  S.tarefas=S.tarefas.filter(t=>{
    if(t.pmpId!==p.id)return true;
    if(t.status==='planejada'&&!t.iniciadoEm){
      const dataOrig=String(t.pmpKey||'').split('|')[2]||t.dataPrevista;
      if(inativo||!cobre.has(t.ativoId)||(mudouAgenda&&!naAgenda(dataOrig))){r.removidas++;return false;}
    }
    const alt=[];
    campos.forEach(([kp,kt,rot])=>{
      if(igual(antes[kp],p[kp]))return;
      if(kt!=='titulo'&&t.status==='concluida')return;
      if(!igual(t[kt],antes[kp]))return;
      t[kt]=p[kp]??'';alt.push(rot);
    });
    if(alt.length){t.historico=t.historico||[];t.historico.push({em:ts,txt:`Atualizada pelo PMP (${alt.join(', ')})`});r.atualizadas++;}
    return true;
  });
  return r;
}
function autoGerar(){
  if(MODO_MORADOR)return;
  if(!S.config.autoGerar||!S.pmp.length)return;
  const n=gerarTarefasPMP(S.config.horizonte);
  if(n){salvar();toast(`${n} tarefa(s) planejada(s) gerada(s) a partir do PMP`);}
}

/* ---------------- Movimentação no Kanban ---------------- */
function mover(t,novo,extra={}){
  const de=t.status;if(de===novo)return;
  const ts=agora();Object.assign(t,extra);
  if(novo==='andamento'){
    if(!t.iniciadoEm)t.iniciadoEm=ts;
    t.andamentoEm=ts;/* momento em que entrou (ou voltou) para a coluna Em andamento */
    t.historico.push({em:ts,txt:de==='validacao'?`Reprovada na validação: ${extra.motivoReprova||'sem motivo informado'}`:de==='concluida'?'Tarefa reaberta':'Execução iniciada'});
    if(de==='validacao'||de==='concluida'){t.execFimEm='';t.concluidoEm='';}
  }else if(novo==='validacao'){
    t.execFimEm=ts;if(!t.iniciadoEm)t.iniciadoEm=ts;
    t.historico.push({em:ts,txt:'Enviada para validação'+(t.executadoPor?` · executada por ${t.executadoPor}`:'')});
  }else if(novo==='concluida'){
    t.concluidoEm=ts;if(!t.execFimEm)t.execFimEm=ts;if(!t.iniciadoEm)t.iniciadoEm=ts;
    t.historico.push({em:ts,txt:`Aprovada e concluída por ${t.validadoPor||'—'}`});
  }else if(novo==='planejada'){
    t.historico.push({em:ts,txt:'Devolvida ao planejamento'});
  }
  t.status=novo;
  if(t.solicitacaoId){const so=S.solicitacoes.find(x=>x.id===t.solicitacaoId);if(so){
    so.historico.push({em:ts,txt:`${t.numeroOS||'OS'}: ${COL[novo].t}`});
    if(novo==='concluida')so.resolvidoEm=ts;else so.resolvidoEm='';}}
  salvar();render();toast(`Tarefa movida para “${COL[novo].t}”`);
}
function pedirMovimento(id,novo){
  const t=S.tarefas.find(x=>x.id===id);if(!t||t.status===novo)return;
  if(novo==='validacao'){
    abrirForm({titulo:'Enviar para validação',botao:'Enviar para validação',dados:{executadoPor:t.executadoPor||t.responsavel,relato:t.relato},
      nota:esc(t.titulo)+' · '+esc(caminho(t.ativoId)),
      campos:[{k:'executadoPor',l:'Executado por',req:true},{k:'relato',l:'Relato da execução',t:'textarea',full:true,ph:'O que foi feito, medições, materiais utilizados…'}],
      salvar:v=>mover(t,'validacao',v)});
  }else if(novo==='concluida'){
    if(t.status!=='validacao'&&!confirm('Esta tarefa ainda não passou pela validação. Concluir mesmo assim?'))return;
    abrirForm({titulo:'Aprovar e concluir',botao:'Aprovar e concluir',dados:{validadoPor:t.validadoPor,parecer:t.parecer},
      nota:esc(t.titulo)+(t.relato?'<br><br><b>Relato:</b> '+esc(t.relato):''),
      campos:[{k:'validadoPor',l:'Validado por',req:true},{k:'parecer',l:'Parecer da validação',t:'textarea',full:true}],
      salvar:v=>mover(t,'concluida',v)});
  }else if(novo==='andamento'&&t.status==='validacao'){
    abrirForm({titulo:'Reprovar e devolver para execução',botao:'Devolver para execução',
      campos:[{k:'motivoReprova',l:'Motivo da reprovação',t:'textarea',req:true,full:true}],
      salvar:v=>mover(t,'andamento',v)});
  }else mover(t,novo);
}

/* ---------------- Modal, formulários e avisos ---------------- */
function abrirModal(html,wide){
  fecharModal();
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)fecharModal();});
  const f=ov.querySelector('.modal input:not([type=checkbox]),.modal select,.modal textarea')||ov.querySelector('.modal button');
  if(f)f.focus();
  return ov.querySelector('.modal');
}
function fecharModal(){$$('.overlay').forEach(o=>o.remove());}
function opt(o){return typeof o==='object'?o:{v:o,l:o};}
function checksHTML(f,sel,vals){
  const ops=(f.optsFn?f.optsFn(vals||{}):f.opts||[]).map(opt);
  if(!ops.length)return `<p class="muted" style="margin:6px 0">${esc(f.vazio||'Nenhuma opção disponível.')}</p>`;
  const s=new Set(sel||[]);
  return ops.map(o=>`<label><input type="checkbox" value="${esc(o.v)}"${s.has(o.v)?' checked':''}> ${esc(o.l)}</label>`).join('');
}
function campoHTML(f,v){
  const id='f_'+f.k,req=f.req?' required':'',ph=f.ph?` placeholder="${esc(f.ph)}"`:'';
  const lab=`<span>${esc(f.l)}${f.req?' *':''}</span>`;
  const hint=f.hint?`<small>${esc(f.hint)}</small>`:'';
  if(f.t==='checks') return `<div class="fld full">${lab}<div class="checks" data-checks="${f.k}">${checksHTML(f,v,null)}</div>${hint}</div>`;
  let inp;
  if(f.t==='select'){
    const op=o=>{o=opt(o);return `<option value="${esc(o.v)}"${String(v??'')===String(o.v)?' selected':''}>${esc(o.l)}</option>`;};
    inp=`<select id="${id}" name="${f.k}"${req}${f.dis?' disabled':''}>${(f.opts||[]).map(o=>o&&o.g?`<optgroup label="${esc(o.g)}">${o.opts.map(op).join('')}</optgroup>`:op(o)).join('')}</select>`;
  }
  else if(f.t==='file') inp=`<input id="${id}" name="${f.k}" type="file" accept="image/*" multiple>`;
  else if(f.t==='textarea') inp=`<textarea id="${id}" name="${f.k}"${req}${ph}>${esc(v)}</textarea>`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${esc(v)}"${req}${ph}${f.t==='number'?' step="any" min="0"':''}${f.max?` maxlength="${f.max}"`:''}>`;
  return `<label class="fld${f.full?' full':''}" for="${id}">${lab}${inp}${hint}</label>`;
}
function coletar(form,campos){
  const v={};
  campos.forEach(f=>{
    if(f.t==='checks'){v[f.k]=$$(`[data-checks="${f.k}"] input:checked`,form).map(i=>i.value);return;}
    const el=form.elements[f.k];if(!el)return;
    if(f.t==='file'){v[f.k]=[...(el.files||[])];return;}

/* ---------------- CNPJ ---------------- */
function mascaraCNPJ(v){
  const d=String(v).replace(/\D/g,'').slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2');
}
function cnpjValido(c){
  c=String(c).replace(/\D/g,'');
  if(c.length!==14||/^(\d)\1+$/.test(c))return false;
  const dv=b=>{let s=0,p=b.length-7;for(let i=0;i<b.length;i++){s+=+b[i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};
  const d1=dv(c.slice(0,12)),d2=dv(c.slice(0,12)+d1);
  return d1===+c[12]&&d2===+c[13];
}

const mascaraCep=v=>{const d=soDig(v).slice(0,8);return d.length>5?d.slice(0,5)+'-'+d.slice(5):d;};

/* CEP no formulário do ativo: consulta ViaCEP/BrasilAPI, preenche o endereço e
   localiza latitude e longitude, que alimentam o Mapa dos Condomínios. */
function prepararCepForm(f){
  const cep=f.elements.cep,end=f.elements.endereco;if(!cep||!end)return;
  cep.inputMode='numeric';cep.maxLength=9;cep.autocomplete='postal-code';
  const fld=cep.closest('.fld'),linha=document.createElement('div');linha.className='cep-linha';
  cep.replaceWith(linha);linha.appendChild(cep);
  const bt=document.createElement('button');bt.type='button';bt.className='btn sm';bt.textContent='Buscar CEP';linha.appendChild(bt);
  const st=document.createElement('small');st.className='cep-st';st.setAttribute('aria-live','polite');fld.appendChild(st);
  const msg=(t,c)=>{st.textContent=t;st.className='cep-st'+(c?' '+c:'');};
  let dados=null,auto=end.value,ultimo=soDig(cep.value),seq=0;
  const localizar=async()=>{
    const n=++seq;msg('Localizando o ponto no mapa…');
    let p=null;try{p=await buscarCoordenadas(end.value);}catch(e){}
    if(!p&&dados){try{p=await buscarCoordenadas([dados.logradouro,f.elements.numero.value,dados.cidade,dados.uf].filter(Boolean).join(', '));}catch(e){}}
    if(!p&&dados&&dados.lat!=null&&dados.lng!=null)p={lat:dados.lat,lng:dados.lng};
    if(n!==seq)return;
    if(!p){msg('Endereço preenchido, mas o ponto não foi localizado. Depois use “Clicar no mapa” na aba Mapa.','bad');return;}
    f.elements.lat.value=fmtCoord(+(+p.lat).toFixed(6));f.elements.lng.value=fmtCoord(+(+p.lng).toFixed(6));
    msg('Endereço e localização preenchidos. Confira e salve.','ok');
  };
  const buscar=async forcar=>{
    const d8=soDig(cep.value);
    if(d8.length!==8){if(forcar)msg('O CEP tem 8 dígitos.','bad');return;}
    if(!forcar&&d8===ultimo)return;ultimo=d8;
    bt.disabled=true;msg('Consultando o CEP…');
    let d=null;try{d=await consultarCep(d8);}catch(e){}
    bt.disabled=false;
    if(!d){msg('CEP não encontrado ou sem conexão. Preencha o endereço manualmente.','bad');return;}
    dados=d;cep.value=mascaraCep(d8);
    auto=comporEndereco(d,f.elements.numero.value.trim(),f.elements.complemento.value.trim(),cep.value);end.value=auto;
    if(!f.elements.numero.value.trim())f.elements.numero.focus();
    await localizar();
  };
  cep.addEventListener('input',()=>{cep.value=mascaraCep(cep.value);if(soDig(cep.value).length===8)buscar(false);});
  cep.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();buscar(true);}});
  bt.addEventListener('click',()=>buscar(true));
  ['numero','complemento'].forEach(k=>f.elements[k].addEventListener('change',()=>{
    if(!dados||end.value!==auto)return;
    auto=comporEndereco(dados,f.elements.numero.value.trim(),f.elements.complemento.value.trim(),cep.value);end.value=auto;
    if(k==='numero')localizar();
  }));
}

/* Seleção de um ou vários itens do PMP para excluir de uma vez */
function ligarSelecaoPmp(v,visiveis){
  [...pmpSel].forEach(id=>{if(!S.pmp.some(x=>x.id===id))pmpSel.delete(id);});
  const atualizar=()=>{
    const n=pmpSel.size,nv=visiveis.filter(id=>pmpSel.has(id)).length,t=$('[data-pmpsel="*"]',v),b=$('#btnPmpExcSel',v);
    if(t){t.checked=nv>0&&nv===visiveis.length;t.indeterminate=nv>0&&nv<visiveis.length;}
    if(b){b.disabled=!n;b.textContent=n?`Excluir selecionados (${n})`:'Excluir selecionados';b.title=n?`${n} item(ns) marcado(s)`+(n>nv?`, ${n-nv} fora desta sub-área`:''):'Marque os itens na tabela';}
  };
  const marcar=(cb,on)=>{cb.checked=on;on?pmpSel.add(cb.dataset.pmpsel):pmpSel.delete(cb.dataset.pmpsel);cb.closest('tr').classList.toggle('marcada',on);};
  $$('[data-pmpsel]',v).forEach(cb=>cb.addEventListener('change',()=>{
    if(cb.dataset.pmpsel==='*')$$('input[data-pmpsel]:not([data-pmpsel="*"])',v).forEach(c=>marcar(c,cb.checked));
    else marcar(cb,cb.checked);
    atualizar();
  }));
  /* clique em qualquer ponto da linha (fora de botões e links) marca ou desmarca */
  $$('tbody tr',v).forEach(tr=>{const cb=$('input[data-pmpsel]',tr);if(!cb)return;tr.classList.add('selecionavel');
    tr.addEventListener('click',e=>{if(e.target.closest('button,a,input,select,label'))return;marcar(cb,!cb.checked);atualizar();});});

}

const PDF_W={
  n:[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584],
  b:[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584]
};
const PDF_CP={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,
  0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
function pdfByte(ch){const c=ch.codePointAt(0);if(c<128)return c;if(c>=0xA0&&c<=0xFF)return c;return PDF_CP[c]||63;}
function pdfLargura(txt,neg,tam){
  let w=0;const t=PDF_W[neg?'b':'n'];
  for(const ch of String(txt)){const base=ch.normalize('NFD')[0];const c=base.charCodeAt(0);w+=(c>=32&&c<=126)?t[c-32]:(ch==='—'?1000:556);}
  return w*tam/1000;
}
function pdfQuebrar(txt,neg,tam,larg){
  const out=[];
  String(txt||'').split('\n').forEach(par=>{
    let linha='';
    par.split(/\s+/).filter(Boolean).forEach(pal=>{
      const t=linha?linha+' '+pal:pal;
      if(pdfLargura(t,neg,tam)<=larg)linha=t;
      else{if(linha)out.push(linha);
        while(pdfLargura(pal,neg,tam)>larg){let k=pal.length;while(k>1&&pdfLargura(pal.slice(0,k),neg,tam)>larg)k--;out.push(pal.slice(0,k));pal=pal.slice(k);}
        linha=pal;}
    });
    out.push(linha);
  });
  return out;
}
const pdfStr=t=>'('+[...String(t)].map(ch=>{const b=pdfByte(ch);const c=String.fromCharCode(b);return b===40||b===41||b===92?'\\'+c:c;}).join('')+')';
const pdfNum=n=>(+n).toFixed(2).replace(/\.?0+$/,'');
const pdfCor=hex=>{const h=hex.replace('#','');return [0,2,4].map(i=>pdfNum(parseInt(h.slice(i,i+2),16)/255)).join(' ');};
/* Documento: páginas com comandos de desenho; imagens JPEG opcionais */
function novoPdf(){
  const W=595.28,H=841.89,M=48;
  const doc={W,H,M,pags:[],img:null,y:0,rodape:null,cur:null};
  doc.pagina=()=>{doc.pags.push([]);doc.y=H-M;if(doc.cab)doc.cab(doc);};
  doc.cmd=c=>doc.pags[doc.cur!=null?doc.cur:doc.pags.length-1].push(c);
  doc.texto=(x,y,t,{tam=10,neg=false,cor='#14202B'}={})=>doc.cmd(`BT ${pdfCor(cor)} rg /${neg?'F2':'F1'} ${tam} Tf ${pdfNum(x)} ${pdfNum(y)} Td ${pdfStr(t)} Tj ET`);
  doc.ret=(x,y,w,h,cor)=>doc.cmd(`${pdfCor(cor)} rg ${pdfNum(x)} ${pdfNum(y)} ${pdfNum(w)} ${pdfNum(h)} re f`);
  doc.linha=(x1,y1,x2,y2,cor='#D3DAE1',esp=0.8)=>doc.cmd(`${pdfCor(cor)} RG ${esp} w ${pdfNum(x1)} ${pdfNum(y1)} m ${pdfNum(x2)} ${pdfNum(y2)} l S`);
  doc.espaco=h=>{if(doc.y-h<M+30)doc.pagina();};
  doc.par=(t,{tam=10,neg=false,cor='#14202B',x=M,larg=W-2*M,entre=1.35}={})=>{
    pdfQuebrar(t,neg,tam,larg).forEach(l=>{doc.espaco(tam*entre);doc.y-=tam*entre;doc.texto(x,doc.y,l,{tam,neg,cor});});
  };
  doc.secao=t=>{doc.espaco(46);doc.y-=26;doc.ret(M,doc.y-5,W-2*M,20,'#EEF3F8');doc.ret(M,doc.y-5,3,20,'#15304C');doc.texto(M+10,doc.y+1,t.toUpperCase(),{tam:10,neg:true,cor:'#15304C'});doc.y-=14;};
  doc.campos=(pares,cols=2)=>{
    const larg=(W-2*M-(cols-1)*16)/cols;
    for(let i=0;i<pares.length;i+=cols){
      const lin=pares.slice(i,i+cols).map(([r,v])=>({r,v:pdfQuebrar(v||'—',false,10,larg)}));
      const h=12+Math.max(...lin.map(c=>c.v.length))*13.5;doc.espaco(h+4);
      lin.forEach((c,k)=>{const x=M+k*(larg+16);doc.texto(x,doc.y-10,c.r,{tam:8,cor:'#5A6977'});c.v.forEach((l,j)=>doc.texto(x,doc.y-23-j*13.5,l,{tam:10,neg:true}));});
      doc.y-=h+4;
    }
  };
  doc.gerar=()=>{
    const objs=[];const add=o=>{objs.push(o);return objs.length;};
    const cat=add(null),pag=add(null);
    const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    let im=0;if(doc.img)im=add({img:doc.img});
    const kids=[];const tot=doc.pags.length;
    doc.pags.forEach((cmds,i)=>{
      if(doc.rodape){doc.cur=i;doc.rodape(doc,i+1,tot);doc.cur=null;}
      const conteudo=cmds.join('\n');
      const c=add({stream:conteudo});
      const p=add(`<< /Type /Page /Parent ${pag} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >>${im?` /XObject << /Im1 ${im} 0 R >>`:''} >> /Contents ${c} 0 R >>`);
      kids.push(p);
    });
    objs[cat-1]=`<< /Type /Catalog /Pages ${pag} 0 R >>`;
    objs[pag-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
    objs.forEach((o,i)=>{
      offs.push(out.length);
      if(typeof o==='string')out+=`${i+1} 0 obj\n${o}\nendobj\n`;
      else if(o.stream!=null){const b=o.stream;/* já está em bytes WinAnsi (pdfStr) */out+=`${i+1} 0 obj\n<< /Length ${b.length} >>\nstream\n${b}\nendstream\nendobj\n`;}
      else{const g=o.img;out+=`${i+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${g.w} /Height ${g.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${g.bin.length} >>\nstream\n${g.bin}\nendstream\nendobj\n`;}
    });
    const xref=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
    return new Blob([u],{type:'application/pdf'});
  };
  return doc;
}
/* Converte o logotipo (PNG ou JPEG) em JPEG com fundo branco para embutir no PDF */
function logoParaPdf(src){
  return new Promise(ok=>{
    if(!src)return ok(null);
    const img=new Image();

function reabrirTarefa(id){const m=$('.overlay .modal'),sc=m?m.scrollTop:0;abrirTarefa(id);const n=$('.overlay .modal');if(n)n.scrollTop=sc;}

async function lerArquivoAnexo(file){
  const img=/^image\/(jpeg|png|webp)$/.test(file.type),pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  if(!img&&!pdf)throw new Error(`“${file.name}” não é PDF nem imagem (JPG, PNG ou WEBP).`);
  let data;
  if(img)data=await lerFoto(file);
  else{
    if(file.size>ANEXO_LIM)throw new Error(`“${file.name}” tem ${tamFmt(file.size)}. O limite é ${tamFmt(ANEXO_LIM)}: reduza ou comprima o PDF.`);
    data=await new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).replace(/^data:[^;]*;/,'data:application/pdf;'));r.onerror=()=>fail(new Error('Falha ao ler '+file.name));r.readAsDataURL(file);});
  }
  const tam=Math.round((data.length-data.indexOf(',')-1)*3/4);
  if(tam>ANEXO_LIM)throw new Error(`“${file.name}” ficou com ${tamFmt(tam)} depois de processado. O limite é ${tamFmt(ANEXO_LIM)}.`);
  const novo={nome:file.name.slice(0,120),tipo:img?'image/jpeg':'application/pdf',tam,data,em:agora(),por:quemSou()};
  if(!anexoOk(novo))throw new Error(`“${file.name}” é inválido.`);
  return novo;
}
inputAnexo.addEventListener('change',async()=>{

  if(k==='relmulti'){
    /* relatório: várias fotos e PDFs de uma vez, cada um no próximo espaço livre */
    const anx={...anexosTarefa(t)},ok=[],erros=[];
    const contar=f=>Object.keys(anx).filter(x=>ehRel(x)&&(ehFoto(anx[x])===f)).length;
    const livre=f=>(f?REL_FOTOS:REL_PDFS).find(x=>!anx[x]);
    toast(`Processando ${files.length} arquivo(s)…`);
    for(const file of files){
      const foto=/^image\//.test(file.type);
      if(foto&&contar(true)>=REL_MAX_FOTOS){erros.push(`“${file.name}”: limite de ${REL_MAX_FOTOS} fotos atingido`);continue;}
      if(!foto&&contar(false)>=REL_MAX_PDFS){erros.push(`“${file.name}”: limite de ${REL_MAX_PDFS} PDFs atingido`);continue;}
      try{const novo=await lerArquivoAnexo(file);const kk=livre(ehFoto(novo));if(!kk){erros.push(`“${file.name}”: sem espaço livre`);continue;}anx[kk]=novo;ok.push(novo.nome);}

    }

    <button data-act="irArvore" data-id="${a.id}">Abrir na árvore de ativos</button></div>`;

function iniciarMapa(){
  if(mapa||typeof L==='undefined')return;
  mapa=L.map('mapBox',{zoomControl:true}).setView(CENTRO_PADRAO,12);
  /* Camadas que funcionam com o arquivo aberto direto do computador (file://).
     Os servidores do OpenStreetMap.org bloqueiam esse tipo de acesso (exigem um site de origem),
     por isso ele só é oferecido quando o sistema estiver hospedado em http/https. */
  const CAMADAS={
    'Ruas':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Mapa &copy; Esri, HERE, Garmin, &copy; colaboradores do OpenStreetMap'}),
    'Ruas (claro)':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd',attribution:'&copy; colaboradores do OpenStreetMap &copy; CARTO'}),
    'Satélite':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagens &copy; Esri, Maxar, Earthstar Geographics'})
  };
  if(/^https?:/.test(location.protocol))CAMADAS['OpenStreetMap']=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; colaboradores do OpenStreetMap'});
  const ordem=Object.keys(CAMADAS);
  let atual=CAMADAS[S.config.camadaMapa]?S.config.camadaMapa:'Ruas';
  CAMADAS[atual].addTo(mapa);L.control.layers(CAMADAS,null,{position:'topright'}).addTo(mapa);
  mapa.on('baselayerchange',e=>{atual=e.name;if(ehAdmin()){S.config.camadaMapa=e.name;salvar();}});
  /* Troca automática se a camada atual não carregar (bloqueio de rede ou do provedor) */
  let trocas=0;
  ordem.forEach(nome=>{let ok=0,erro=0;CAMADAS[nome].on('tileload',()=>ok++);CAMADAS[nome].on('tileerror',()=>{
    erro++;if(nome!==atual||ok>0||erro<6)return;
    if(trocas>=ordem.length-1){if(trocas++===ordem.length-1)toast('Nenhuma camada de mapa carregou. Verifique a internet ou se a rede bloqueia esses servidores.',true);return;}trocas++;
    const prox=ordem[(ordem.indexOf(nome)+1)%ordem.length];if(prox===nome)return;
    mapa.removeLayer(CAMADAS[nome]);CAMADAS[prox].addTo(mapa);atual=prox;
    toast(`A camada “${nome}” não carregou nesta rede. Exibindo “${prox}”.`,true);});});
  camadaMarc=L.layerGroup().addTo(mapa);
  mapa.on('click',e=>{
    if(!posicionando)return;const a=getAtivo(posicionando);posicionando='';$('#mapBox').classList.remove('posicionando');
    if(!a)return;a.lat=+e.latlng.lat.toFixed(6);a.lng=+e.latlng.lng.toFixed(6);mapaSel=a.id;salvar();renderMapa();toast(`Localização de “${a.nome}” definida`);
  });
}

/* Geocodificação: Esri (funciona com o arquivo local) e, se falhar, Nominatim/OpenStreetMap */
async function buscarCoordenadas(endereco){
  let falhas=0;
  try{
    const r=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&countryCode=BRA&langCode=pt&singleLine='+encodeURIComponent(endereco));
    if(r.ok){const j=await r.json();const c=j.candidates&&j.candidates[0];if(c&&c.location&&c.score>=70)return {lat:+c.location.y,lng:+c.location.x};}else falhas++;
  }catch(e){falhas++;}
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(endereco));
    if(r.ok){const j=await r.json();if(j.length)return {lat:+j[0].lat,lng:+j[0].lon};}else falhas++;
  }catch(e){falhas++;}
  if(falhas>=2)throw new Error('rede');
  return null;
}

/* Localização pelo CEP (ViaCEP, com BrasilAPI de reserva) e pelo GPS do aparelho */
const soDig=v=>String(v||'').replace(/\D/g,'');
async function consultarCep(cep){
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    if(r.ok){const d=await r.json();if(d&&!d.erro)return{logradouro:d.logradouro||'',bairro:d.bairro||'',cidade:d.localidade||'',uf:d.uf||''};}
  }catch(e){}
  const r=await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
  if(!r.ok)return null;
  const d=await r.json();
  const c=d&&d.location&&d.location.coordinates;
  return{logradouro:d.street||'',bairro:d.neighborhood||'',cidade:d.city||'',uf:d.state||'',
    lat:c&&c.latitude?+c.latitude:null,lng:c&&c.longitude?+c.longitude:null};
}
function mapaCep(id){
  const a=getAtivo(id);if(!a)return;
  abrirForm({titulo:`Localizar pelo CEP · ${a.nome}`,botao:'Buscar endereço',
    campos:[{k:'cep',l:'CEP',req:true,ph:'00000-000',valid:v=>soDig(v).length!==8?'O CEP tem 8 dígitos.':''},
      {k:'numero',l:'Número',ph:'Ex.: 120'},{k:'complemento',l:'Complemento',full:true,ph:'Opcional'}],
    dados:{cep:a.cep||'',numero:a.numero||'',complemento:a.complemento||''},
    salvar:async v=>{
      const cep=soDig(v.cep);toast('Consultando o CEP…');
      let d=null;try{d=await consultarCep(cep);}catch(e){}
      if(!d){toast('CEP não encontrado ou sem conexão. Confira o número.',true);return;}
      const cepFmt=cep.slice(0,5)+'-'+cep.slice(5);
      const end=[[d.logradouro,v.numero].filter(Boolean).join(', '),v.complemento,d.bairro,[d.cidade,d.uf].filter(Boolean).join('/'),'CEP '+cepFmt].filter(Boolean).join(' · ').replace(/ · /g,', ');
      setTimeout(()=>confirmarEnderecoMapa(a,{endereco:end,cep:cepFmt,numero:v.numero||'',complemento:v.complemento||'',d}),50);
    }});
}
function confirmarEnderecoMapa(a,info){
  abrirForm({titulo:'Confirmar endereço',botao:'Registrar no mapa',
    nota:'Confira e corrija o endereço, se precisar. O sistema localiza o ponto no mapa a partir dele.',
    campos:[{k:'endereco',l:'Endereço',req:true,full:true,max:300}],dados:{endereco:info.endereco},
    salvar:async v=>{
      a.endereco=v.endereco.trim();a.cep=info.cep;a.numero=info.numero;if(info.complemento!=null)a.complemento=info.complemento;
      toast('Localizando no mapa…');
      let p=null;
      try{p=await buscarCoordenadas(a.endereco);}catch(e){}
      if(!p){const d=info.d;try{p=await buscarCoordenadas([d.logradouro,info.numero,d.cidade,d.uf].filter(Boolean).join(', '));}catch(e){}}
      if(!p&&info.d.lat!=null&&info.d.lng!=null)p={lat:info.d.lat,lng:info.d.lng};
      if(!p){try{p=await buscarCoordenadas(`${info.cep} ${info.d.cidade||''} ${info.d.uf||''}`);}catch(e){}}
      if(!p){salvar();renderMapa();toast('Endereço salvo, mas o ponto não foi encontrado. Use “Clicar no mapa”.',true);return;}
      a.lat=+(+p.lat).toFixed(6);a.lng=+(+p.lng).toFixed(6);mapaSel=a.id;salvar();renderMapa();
      if(mapa)mapa.setView([a.lat,a.lng],17);
      toast(`“${a.nome}” registrado no mapa. Se o ponto não estiver exato, use “Reposicionar”.`);
    }});
}
function mapaGps(id){
  const a=getAtivo(id);if(!a)return;
  if(!navigator.geolocation){toast('Este navegador não oferece localização por GPS.',true);return;}
  toast('Obtendo a sua localização…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy:pr}=pos.coords;
    if(!confirm(`Registrar “${a.nome}” na sua localização atual?\n\nPrecisão aproximada: ${Math.round(pr)} m.\nFaça isso estando no próprio condomínio.`))return;
    a.lat=+lat.toFixed(6);a.lng=+lng.toFixed(6);
    if(!a.endereco){
      try{const r=await fetch(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&langCode=pt&location=${lng},${lat}`);
        const d=await r.json();if(d&&d.address&&d.address.LongLabel)a.endereco=String(d.address.LongLabel).slice(0,300);}catch(e){}
    }
    mapaSel=a.id;salvar();renderMapa();if(mapa)mapa.setView([a.lat,a.lng],18);
    toast(`“${a.nome}” registrado no mapa pelo GPS.`);
  },err=>{
    toast(err.code===1?'Permissão de localização negada. Libere a localização para este site no navegador.':'Não foi possível obter a localização. Tente de novo em local aberto.',true);
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
async function geocodificar(id){
  const a=getAtivo(id);if(!a||!a.endereco)return;
  toast('Buscando endereço…');
  try{
    const ponto=await buscarCoordenadas(a.endereco);
    if(!ponto){toast('Endereço não encontrado. Use “Clicar no mapa” ou revise o endereço.',true);return;}
    a.lat=+ponto.lat.toFixed(6);a.lng=+ponto.lng.toFixed(6);mapaSel=a.id;salvar();renderMapa();
    if(mapa)mapa.setView([a.lat,a.lng],17);
    toast('Localização encontrada. Confira o marcador; se precisar, use “Reposicionar”.');
  }catch(e){toast('Não foi possível consultar o endereço (verifique a internet).',true);}
}

const ASSUNTOS = ['Vazamento / infiltração','Hidráulica / falta d’água','Elétrica / iluminação','Elevador','Portão / interfone / acesso','Limpeza e conservação','Áreas de lazer','Pragas','Segurança','Barulho / convivência','Outro'];
const URGENCIAS = ['Baixa','Normal','Alta','Urgente'];
const ST_SOL = {aberta:{t:'Aberta',c:'--c-plan'},analise:{t:'Em análise',c:'--c-and'},atendimento:{t:'Em atendimento (OS)',c:'--c-val'},resolvida:{t:'Resolvida',c:'--c-con'},recusada:{t:'Recusada',c:'--bad'}};
const getSol = id=>S.solicitacoes.find(x=>x.id===id);
function statusSol(x){
  if(x.status==='recusada')return 'recusada';
  if(x.osId){const t=S.tarefas.find(y=>y.id===x.osId);if(t)return t.status==='concluida'?'resolvida':'atendimento';}
  return ST_SOL[x.status]?x.status:'aberta';
}
const pillSol = x=>{const k=statusSol(x);return `<span class="pill" style="--cc:var(${ST_SOL[k].c})">${ST_SOL[k].t}</span>`;};
/* Protocolo de solicitação: SOL + ano + sequência, sem hífen (ex.: SOL20260010). OS e ORC mantêm o formato com hífen. */
function montarNumero(prefixo,n){const a=new Date().getFullYear(),q=String(n).padStart(4,'0');return prefixo==='SOL'?`SOL${a}${q}`:`${prefixo}-${a}-${q}`;}
const protoNorm=p=>String(p||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function proximoNumero(chave,prefixo){S.config[chave]=(+S.config[chave]||0)+1;return montarNumero(prefixo,S.config[chave]);}
function lerFoto(file){
  return new Promise((ok,fail)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7));};
      img.onerror=()=>fail(new Error('Imagem inválida'));img.src=r.result;};
    r.onerror=()=>fail(new Error('Falha ao ler a imagem'));r.readAsDataURL(file);
  });
}

function abrirSolicitacao(id){
  const so=getSol(id);if(!so)return;
  const k=statusSol(so),t=so.osId?S.tarefas.find(y=>y.id===so.osId):null,c=getAtivo(so.condominioId);
  const at=(l,v)=>`<div><span>${l}</span><b>${esc(v||'—')}</b></div>`;
  const b=[];
  if(!t&&!['recusada','resolvida'].includes(k)){
    if(k==='aberta')b.push(['solAnalise','Iniciar análise','']);
    b.push(['solRecusar','Recusar','danger'],['solEncerrar','Resolver sem OS',''],['gerarOS','Gerar Ordem de Serviço','primary']);

    if(FIREBASE_CONFIG){
      out.innerHTML='<p class="muted">Consultando…</p>';

        else{const l=[];for(let i=0;i<MAX_POR_NOME;i++){const c=(await comTempo(fbDb.ref(PUB_PATH+'/consulta/'+chaveConsultaNome(termo,unidade,i)).once('value'),15000)).val();if(!c)break;l.push(c);}mostrar(l);}
      }catch(err){out.innerHTML='<p class="erro">Não foi possível consultar agora. Verifique a internet.</p>';}
      return;
    }
    const daUnidade=S.solicitacoes.filter(x=>unidNorm(x.unidade)===un);
    const l=ehProto?daUnidade.filter(x=>protoNorm(x.protocolo)===pn):daUnidade.filter(x=>nomeNorm(x.nome)===nomeNorm(termo));
    mostrar(l.map(x=>({protocolo:x.protocolo,status:statusSol(x),criadoEm:x.criadoEm,resposta:x.resposta})));
  });
}

/* ================================================================
   QR CODE DOS ATIVOS
   Cada ativo tem um QR Code com o endereço do sistema + #ativo=<id>.
   Ao ler o código, o sistema abre a lista de tarefas do ativo
   (planejadas, em andamento, em validação e concluídas) e cada OS pode ser aberta.
   ================================================================ */
/* ---------------- Gerador de QR Code (modo byte, correção de erro M) ----------------
   Implementação própria (sem bibliotecas externas), baseada na norma ISO/IEC 18004. */
const QR=(()=>{
  const ECC_M=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLOCOS_M=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const bit=(x,i)=>((x>>>i)&1)!==0;
  const modulosBrutos=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const cwDados=v=>Math.floor(modulosBrutos(v)/8)-ECC_M[v]*BLOCOS_M[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const divisor=g=>{const r=[];for(let i=0;i<g-1;i++)r.push(0);r.push(1);let raiz=1;for(let i=0;i<g;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],raiz);if(j+1<r.length)r[j]^=r[j+1];}raiz=mul(raiz,2);}return r;};
  const resto=(dados,div)=>{const r=div.map(()=>0);for(const b of dados){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f);});}return r;};
  const alinhamento=v=>{if(v===1)return[];const n=Math.floor(v/7)+2,passo=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,r=[6];for(let p=v*4+10;r.length<n;p-=passo)r.splice(1,0,p);return r;};
  function gerar(texto){
    const bytes=[...new TextEncoder().encode(texto)];
    let v=1;for(;v<=40;v++){const cc=v<10?8:16;if(4+cc+bytes.length*8<=cwDados(v)*8)break;}
    if(v>40)throw new Error('Texto longo demais para o QR Code');
    const cc=v<10?8:16,bits=[];const push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
    push(4,4);push(bytes.length,cc);bytes.forEach(b=>push(b,8));
    const cap=cwDados(v)*8;push(0,Math.min(4,cap-bits.length));push(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)push(p,8);
    const dados=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];dados.push(b);}
    // blocos + correção de erro + intercalação
    const nb=BLOCOS_M[v],ecc=ECC_M[v],brutos=Math.floor(modulosBrutos(v)/8),curtos=nb-brutos%nb,lenCurto=Math.floor(brutos/nb),div=divisor(ecc),blocos=[];
    for(let i=0,k=0;i<nb;i++){const d=dados.slice(k,k+lenCurto-ecc+(i<curtos?0:1));k+=d.length;const e=resto(d,div);if(i<curtos)d.push(0);blocos.push(d.concat(e));}
    const cw=[];for(let i=0;i<blocos[0].length;i++)blocos.forEach((b,j)=>{if(i!==lenCurto-ecc||j>=curtos)cw.push(b[i]);});
    // matriz
    const n=v*4+17,M=[...Array(n)].map(()=>Array(n).fill(false)),F=[...Array(n)].map(()=>Array(n).fill(false));
    const fx=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<n;i++){fx(6,i,i%2===0);fx(i,6,i%2===0);}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<n&&yy>=0&&yy<n)fx(xx,yy,d!==2&&d!==4);}};
    finder(3,3);finder(n-4,3);finder(3,n-4);
    const al=alinhamento(v),na=al.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)fx(al[i]+dx,al[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
    const formato=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;
      for(let i=0;i<=5;i++)fx(8,i,bit(b,i));fx(8,7,bit(b,6));fx(8,8,bit(b,7));fx(7,8,bit(b,8));for(let i=9;i<15;i++)fx(14-i,8,bit(b,i));
      for(let i=0;i<8;i++)fx(n-1-i,8,bit(b,i));for(let i=8;i<15;i++)fx(8,n-15+i,bit(b,i));fx(8,n-8,true);};
    formato(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;for(let i=0;i<18;i++){const t=bit(b,i),a=n-11+i%3,c=Math.floor(i/3);fx(a,c,t);fx(c,a,t);}}
    let i=0;for(let dir=n-1;dir>=1;dir-=2){if(dir===6)dir=5;for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=dir-j,sobe=((dir+1)&2)===0,y=sobe?n-1-vert:vert;if(!F[y][x]&&i<cw.length*8){M[y][x]=bit(cw[i>>>3],7-(i&7));i++;}}}
    const mascara=m=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++){let t;switch(m){case 0:t=(x+y)%2===0;break;case 1:t=y%2===0;break;case 2:t=x%3===0;break;case 3:t=(x+y)%3===0;break;
      case 4:t=(Math.floor(x/3)+Math.floor(y/2))%2===0;break;case 5:t=x*y%2+x*y%3===0;break;case 6:t=(x*y%2+x*y%3)%2===0;break;default:t=((x+y)%2+x*y%3)%2===0;}if(!F[y][x]&&t)M[y][x]=!M[y][x];}};
    const penalidade=()=>{let p=0;
      for(let y=0;y<n;y++){let c=1;for(let x=1;x<=n;x++){if(x<n&&M[y][x]===M[y][x-1])c++;else{if(c>=5)p+=c-2;c=1;}}}
      for(let x=0;x<n;x++){let c=1;for(let y=1;y<=n;y++){if(y<n&&M[y][x]===M[y-1][x])c++;else{if(c>=5)p+=c-2;c=1;}}}
      for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
      let esc=0;M.forEach(l=>l.forEach(c=>{if(c)esc++;}));p+=Math.floor(Math.abs(esc*20-n*n*10)/(n*n))*10;return p;};
    let melhor=0,pmin=Infinity;
    for(let m=0;m<8;m++){mascara(m);formato(m);const p=penalidade();if(p<pmin){pmin=p;melhor=m;}mascara(m);}
    mascara(melhor);formato(melhor);
    return {tamanho:n,versao:v,modulos:M};
  }
  function svg(texto,{borda=4,cor='#000'}={}){
    const q=gerar(texto),n=q.tamanho,t=n+2*borda;let d='';
    q.modulos.forEach((l,y)=>l.forEach((c,x)=>{if(c)d+=`M${x+borda},${y+borda}h1v1h-1z`;}));

  }
  return {gerar,svg};
})();

      :`<p class="nota" style="margin:0">O sistema está aberto direto do computador (arquivo local). Para o QR Code funcionar no celular, ele precisa apontar para o endereço publicado do sistema (https).</p>
        ${podeCfg?`<label class="fld" style="margin-top:12px"><span>Endereço publicado do sistema</span><input id="qrUrlPub" placeholder="https://seu-projeto.web.app/index.html" value="${esc(S.config.urlPublica||'')}"></label>
        <p style="margin:8px 0 0"><button type="button" class="btn primary" data-act="qrSalvarUrl" data-id="${esc(a.id)}">Salvar endereço e gerar QR Code</button></p>`:'<p class="muted">Peça a um administrador para informar o endereço publicado do sistema.</p>'}`}

function baixarQRPng(id){
  const a=getAtivo(id),url=urlAtivo(id);if(!a||!url)return;
  const q=QR.gerar(url),esc_=10,borda=4,lado=(q.tamanho+2*borda)*esc_,rod=86;
  const c=document.createElement('canvas');c.width=lado;c.height=lado+rod;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';
  q.modulos.forEach((l,y)=>l.forEach((m,x)=>{if(m)g.fillRect((x+borda)*esc_,(y+borda)*esc_,esc_,esc_);}));
  g.textAlign='center';g.fillStyle='#14202B';
  const caber=(t,f,max)=>{g.font=f;let s=t;while(g.measureText(s).width>max&&s.length>4)s=s.slice(0,-2);return s===t?t:s+'…';};
  g.fillText(caber(a.nome,'bold 26px Arial',lado-30),lado/2,lado+20);
  if(a.codigo){g.fillStyle='#5A6977';g.fillText(caber(a.codigo,'20px Arial',lado-30),lado/2,lado+52);}
  c.toBlob(b=>{const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`QR_${String(a.codigo||a.nome).replace(/[^\w-]+/g,'_')}.png`;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);},'image/png');
}
/* Etiquetas para impressão (uma ou várias, 3 por linha em A4) */
function imprimirEtiquetas(ids){
  const lista=ids.map(getAtivo).filter(Boolean);

  if(!urlSistema()){toast('Informe o endereço publicado do sistema no QR Code de um ativo antes de imprimir.',true);return;}
  $('#printArea')?.remove();
  const p=document.createElement('div');p.id='printArea';
  p.innerHTML=`<div class="etq-grid">${lista.map(a=>`<div class="etq">${QR.svg(urlAtivo(a.id))}<b>${esc(a.nome)}</b>${a.codigo?`<span class="etq-cod">${esc(a.codigo)}</span>`:''}<span class="etq-cam">${esc(caminho(a.id))}</span><span class="etq-dica">Aponte a câmera para ver as tarefas</span></div>`).join('')}</div>`;
  document.body.appendChild(p);
  const limpar=()=>{p.remove();window.removeEventListener('afterprint',limpar);};

}

/* Tela aberta pela leitura do QR Code: tarefas do ativo por etapa */
function abrirTarefasAtivo(id,inclFilhos){
  const a=getAtivo(id);if(!a){toast('Ativo não encontrado ou sem acesso.',true);return;}
  const desc=descendentes(id),ids=new Set(inclFilhos?[id,...desc]:[id]);
  const ts=S.tarefas.filter(t=>ids.has(t.ativoId));
  const emerg=(x,y)=>(y.tipo==='Emergência')-(x.tipo==='Emergência');
  const ord={planejada:(x,y)=>emerg(x,y)||String(x.dataPrevista).localeCompare(String(y.dataPrevista)),
    andamento:(x,y)=>emerg(x,y)||String(y.andamentoEm||y.iniciadoEm||'').localeCompare(String(x.andamentoEm||x.iniciadoEm||'')),
    validacao:(x,y)=>emerg(x,y)||String(x.execFimEm).localeCompare(String(y.execFimEm)),
    concluida:(x,y)=>String(y.concluidoEm).localeCompare(String(x.concluidoEm))};
  const LIM=30;
  const linha=t=>{const atras=t.status!=='concluida'&&t.dataPrevista&&t.dataPrevista<hoje(),per=perTarefa(t);
    return `<button type="button" class="qt-it" data-act="abrirTarefa" data-id="${esc(t.id)}" style="--tc:var(${TIPOS[t.tipo]?.cor||'--t-prev'})">
      <span class="qt-top"><span class="tag">${esc(TIPOS[t.tipo]?.nome||t.tipo)}</span>${t.numeroOS?`<span class="muted">${esc(t.numeroOS)}</span>`:''}${t.prioridade==='Alta'||t.prioridade==='Crítica'?`<span class="prio">${esc(t.prioridade)}</span>`:''}</span>
      <b>${esc(t.titulo)}</b>
      <span class="qt-meta"><span class="${atras?'late':''}">${t.status==='concluida'?'Concluída em '+fmt(t.concluidoEm):fmt(t.dataPrevista)+(atras?' · atrasada':'')}</span>${per?`<span class="per">${esc(per)}</span>`:''}${inclFilhos&&t.ativoId!==id?`<span class="muted">· ${esc(getAtivo(t.ativoId)?.nome||'')}</span>`:''}</span></button>`;};
  const secoes=COLUNAS.map(c=>{const l=ts.filter(t=>t.status===c.k).sort(ord[c.k]);
    return {c,l,html:`<section class="qt-sec" id="qt-${c.k}" style="--cc:var(${c.cc})"><h4>${esc(c.t)} <span class="q">${l.length}</span></h4>
      ${l.length?l.slice(0,LIM).map(linha).join('')+(l.length>LIM?`<p class="muted" style="margin:6px 0 0">Mais ${l.length-LIM} tarefa(s) no Kanban.</p>`:''):'<p class="muted" style="margin:4px 0 0">Nenhuma tarefa.</p>'}</section>`};});
  abrirModal(`<header class="mh"><div><h3>${esc(a.nome)}</h3><div class="crumb">${esc(caminho(a.id))}${a.codigo?' · '+esc(a.codigo):''}</div></div><button type="button" class="x" data-act="fecharModal" aria-label="Fechar">×</button></header>
    <div class="tdet">
      <div class="qt-resumo">${secoes.map(s=>`<button type="button" class="qt-chip" data-qtsec="${s.c.k}" style="--cc:var(${s.c.cc})"><b>${s.l.length}</b><span>${({planejada:'Planejadas',andamento:'Em andamento',validacao:'Em validação',concluida:'Concluídas'})[s.c.k]||esc(s.c.t)}</span></button>`).join('')}</div>
      ${desc.length?`<label class="qt-filhos"><input type="checkbox" data-qtfilhos="${esc(id)}"${inclFilhos?' checked':''}> Incluir tarefas dos ${desc.length} ativo(s) abaixo deste</label>`:''}
      ${secoes.map(s=>s.html).join('')}
    </div>
    <footer class="mf"><div class="left"><button type="button" class="btn" data-act="irArvore" data-id="${esc(a.id)}">Ver na árvore</button><button type="button" class="btn" data-act="qrAtivo" data-id="${esc(a.id)}">QR Code</button></div>
      <button type="button" class="btn primary" data-act="tarefaAtivo" data-id="${esc(a.id)}">Nova tarefa para este ativo</button></footer>`,true);
  const m=$('.overlay .modal');
  $$('[data-qtsec]',m).forEach(b=>b.addEventListener('click',()=>{const s=$('#qt-'+b.dataset.qtsec,m);if(s)m.scrollTo({top:s.offsetTop-70,behavior:'smooth'});}));
  const cb=$('[data-qtfilhos]',m);if(cb)cb.addEventListener('change',()=>abrirTarefasAtivo(id,cb.checked));
}
function migrarProtocolos(){
  if(MODO_MORADOR||(FIREBASE_CONFIG&&!(appLiberado&&ehAdmin())))return;
  let n=0;S.solicitacoes.forEach(x=>{const p=protoNorm(x.protocolo);if(x.protocolo&&/^SOL\d+$/.test(p)&&p!==x.protocolo){x.protocolo=p;n++;}});
  if(n)salvar();
}
function abrirQRPendente(){
  if(!qrPendente||(FIREBASE_CONFIG&&!appLiberado))return;
  if(!getAtivo(qrPendente)){if(S.ativos.length&&++qrTentativas>3){toast('O ativo deste QR Code não foi encontrado.',true);qrPendente='';}return;}
  const id=qrPendente;qrPendente='';qrTentativas=0;setTimeout(()=>abrirTarefasAtivo(id),0);
}

function baixarQRMoradorPng(cond){
  const url=urlMorador(cond);if(!url)return;const c=getAtivo(cond);
  const q=QR.gerar(url),e=12,borda=4,lado=(q.tamanho+2*borda)*e,rod=c?120:84;
  const cv=document.createElement('canvas');cv.width=lado;cv.height=lado+rod;const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#000';
  q.modulos.forEach((l,y)=>l.forEach((m,x)=>{if(m)g.fillRect((x+borda)*e,(y+borda)*e,e,e);}));
  g.textAlign='center';g.fillStyle='#14202B';g.font='bold 30px Arial';g.fillText('Solicitação de manutenção',lado/2,lado+28);
  g.font='22px Arial';g.fillStyle='#5A6977';g.fillText('Aponte a câmera do celular',lado/2,lado+62);

function trocarAba(a){
  if(!RENDER[a]||(a==='usuarios'&&!ehSuper()))return;
  if(FIREBASE_CONFIG&&!appLiberado&&!MODO_MORADOR)return;
  aba=a;
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===a)));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+a));
  try{sessionStorage.setItem('om_aba',a);}catch(e){}
  if(location.hash!=='#'+a)history.replaceState(null,'','#'+a);
  render();
}
let moradorIniciado=false;
function render(){
  if(MODO_MORADOR){aplicarMarca();if(!moradorIniciado||(!$('#formConsulta'))){moradorIniciado=true;renderMorador();}return;}
  aplicarMarca();
  if(FIREBASE_CONFIG&&!appLiberado)return;
  RENDER[aba]();
  ajustarLayout();
  const ns=S.solicitacoes.filter(x=>['aberta','analise'].includes(statusSol(x))).length;$('#nSol').textContent=ns;$('#nSol').dataset.z=ns?'0':'1';
  const n=S.tarefas.filter(t=>t.status!=='concluida').length;$('#nKanban').textContent=n;$('#nKanban').dataset.z=n?'0':'1';
  aplicarCelular();
  abrirQRPendente();
  migrarProtocolos();
}

/* Geocodificação: Esri (funciona com o arquivo local) e, se falhar, Nominatim/OpenStreetMap */
async function buscarCoordenadas(endereco){
  let falhas=0;
  try{
    const r=await fetch('https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&countryCode=BRA&langCode=pt&singleLine='+encodeURIComponent(endereco));
    if(r.ok){const j=await r.json();const c=j.candidates&&j.candidates[0];if(c&&c.location&&c.score>=70)return {lat:+c.location.y,lng:+c.location.x};}else falhas++;
  }catch(e){falhas++;}
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(endereco));
    if(r.ok){const j=await r.json();if(j.length)return {lat:+j[0].lat,lng:+j[0].lon};}else falhas++;
  }catch(e){falhas++;}
  if(falhas>=2)throw new Error('rede');
  return null;
}

/* Localização pelo CEP (ViaCEP, com BrasilAPI de reserva) e pelo GPS do aparelho */
const soDig=v=>String(v||'').replace(/\D/g,'');
async function consultarCep(cep){
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    if(r.ok){const d=await r.json();if(d&&!d.erro)return{logradouro:d.logradouro||'',bairro:d.bairro||'',cidade:d.localidade||'',uf:d.uf||''};}
  }catch(e){}
  const r=await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
  if(!r.ok)return null;
  const d=await r.json();
  const c=d&&d.location&&d.location.coordinates;
  return{logradouro:d.street||'',bairro:d.neighborhood||'',cidade:d.city||'',uf:d.state||'',
    lat:c&&c.latitude?+c.latitude:null,lng:c&&c.longitude?+c.longitude:null};
}
function mapaCep(id){
  const a=getAtivo(id);if(!a)return;
  abrirForm({titulo:`Localizar pelo CEP · ${a.nome}`,botao:'Buscar endereço',
    campos:[{k:'cep',l:'CEP',req:true,ph:'00000-000',valid:v=>soDig(v).length!==8?'O CEP tem 8 dígitos.':''},
      {k:'numero',l:'Número',ph:'Ex.: 120'},{k:'complemento',l:'Complemento',full:true,ph:'Opcional'}],
    dados:{cep:a.cep||'',numero:a.numero||''},
    salvar:async v=>{
      const cep=soDig(v.cep);toast('Consultando o CEP…');
      let d=null;try{d=await consultarCep(cep);}catch(e){}
      if(!d){toast('CEP não encontrado ou sem conexão. Confira o número.',true);return;}
      const cepFmt=cep.slice(0,5)+'-'+cep.slice(5);
      const end=[[d.logradouro,v.numero].filter(Boolean).join(', '),v.complemento,d.bairro,[d.cidade,d.uf].filter(Boolean).join('/'),'CEP '+cepFmt].filter(Boolean).join(' · ').replace(/ · /g,', ');
      setTimeout(()=>confirmarEnderecoMapa(a,{endereco:end,cep:cepFmt,numero:v.numero||'',d}),50);
    }});
}
function confirmarEnderecoMapa(a,info){
  abrirForm({titulo:'Confirmar endereço',botao:'Registrar no mapa',
    nota:'Confira e corrija o endereço, se precisar. O sistema localiza o ponto no mapa a partir dele.',
    campos:[{k:'endereco',l:'Endereço',req:true,full:true,max:300}],dados:{endereco:info.endereco},
    salvar:async v=>{
      a.endereco=v.endereco.trim();a.cep=info.cep;a.numero=info.numero;
      toast('Localizando no mapa…');
      let p=null;
      try{p=await buscarCoordenadas(a.endereco);}catch(e){}
      if(!p){const d=info.d;try{p=await buscarCoordenadas([d.logradouro,info.numero,d.cidade,d.uf].filter(Boolean).join(', '));}catch(e){}}
      if(!p&&info.d.lat!=null&&info.d.lng!=null)p={lat:info.d.lat,lng:info.d.lng};
      if(!p){try{p=await buscarCoordenadas(`${info.cep} ${info.d.cidade||''} ${info.d.uf||''}`);}catch(e){}}
      if(!p){salvar();renderMapa();toast('Endereço salvo, mas o ponto não foi encontrado. Use “Clicar no mapa”.',true);return;}
      a.lat=+(+p.lat).toFixed(6);a.lng=+(+p.lng).toFixed(6);mapaSel=a.id;salvar();renderMapa();
      if(mapa)mapa.setView([a.lat,a.lng],17);
      toast(`“${a.nome}” registrado no mapa. Se o ponto não estiver exato, use “Reposicionar”.`);
    }});
}
function mapaGps(id){
  const a=getAtivo(id);if(!a)return;
  if(!navigator.geolocation){toast('Este navegador não oferece localização por GPS.',true);return;}
  toast('Obtendo a sua localização…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy:pr}=pos.coords;
    if(!confirm(`Registrar “${a.nome}” na sua localização atual?\n\nPrecisão aproximada: ${Math.round(pr)} m.\nFaça isso estando no próprio condomínio.`))return;
    a.lat=+lat.toFixed(6);a.lng=+lng.toFixed(6);
    if(!a.endereco){
      try{const r=await fetch(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=json&langCode=pt&location=${lng},${lat}`);
        const d=await r.json();if(d&&d.address&&d.address.LongLabel)a.endereco=String(d.address.LongLabel).slice(0,300);}catch(e){}
    }
    mapaSel=a.id;salvar();renderMapa();if(mapa)mapa.setView([a.lat,a.lng],18);
    toast(`“${a.nome}” registrado no mapa pelo GPS.`);
  },err=>{
    toast(err.code===1?'Permissão de localização negada. Libere a localização para este site no navegador.':'Não foi possível obter a localização. Tente de novo em local aberto.',true);
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
async function geocodificar(id){
  const a=getAtivo(id);if(!a||!a.endereco)return;
  toast('Buscando endereço…');
  try{
    const ponto=await buscarCoordenadas(a.endereco);
    if(!ponto){toast('Endereço não encontrado. Use “Clicar no mapa” ou revise o endereço.',true);return;}
    a.lat=+ponto.lat.toFixed(6);a.lng=+ponto.lng.toFixed(6);mapaSel=a.id;salvar();renderMapa();
    if(mapa)mapa.setView([a.lat,a.lng],17);
    toast('Localização encontrada. Confira o marcador; se precisar, use “Reposicionar”.');
  }catch(e){toast('Não foi possível consultar o endereço (verifique a internet).',true);}
}

const ASSUNTOS = ['Vazamento / infiltração','Hidráulica / falta d’água','Elétrica / iluminação','Elevador','Portão / interfone / acesso','Limpeza e conservação','Áreas de lazer','Pragas','Segurança','Barulho / convivência','Outro'];
const URGENCIAS = ['Baixa','Normal','Alta','Urgente'];
const ST_SOL = {aberta:{t:'Aberta',c:'--c-plan'},analise:{t:'Em análise',c:'--c-and'},atendimento:{t:'Em atendimento (OS)',c:'--c-val'},resolvida:{t:'Resolvida',c:'--c-con'},recusada:{t:'Recusada',c:'--bad'}};
const getSol = id=>S.solicitacoes.find(x=>x.id===id);
function statusSol(x){
  if(x.status==='recusada')return 'recusada';
  if(x.osId){const t=S.tarefas.find(y=>y.id===x.osId);if(t)return t.status==='concluida'?'resolvida':'atendimento';}
  return ST_SOL[x.status]?x.status:'aberta';
}
const pillSol = x=>{const k=statusSol(x);return `<span class="pill" style="--cc:var(${ST_SOL[k].c})">${ST_SOL[k].t}</span>`;};
function proximoNumero(chave,prefixo){S.config[chave]=(+S.config[chave]||0)+1;return `${prefixo}-${new Date().getFullYear()}-${String(S.config[chave]).padStart(4,'0')}`;}
function lerFoto(file){
  return new Promise((ok,fail)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1024/Math.max(img.width,img.height));const c=document.createElement('canvas');
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7));};
      img.onerror=()=>fail(new Error('Imagem inválida'));img.src=r.result;};
    r.onerror=()=>fail(new Error('Falha ao ler a imagem'));r.readAsDataURL(file);
  });
}
function camposSolicitacao(interno){
  const conds=(interno||!FIREBASE_CONFIG?condominios():PUB_CONDS).map(c=>({v:c.id,l:c.nome}));
  const c=[
    {k:'condominioId',l:'Condomínio',t:'select',req:true,opts:conds.length>1?[{v:'',l:'Selecione…'},...conds]:conds},
    {k:'unidade',l:'Unidade (bloco / apto)',req:true,ph:'Ex.: Torre A · 502'},
    {k:'nome',l:'Nome do morador',req:true},
    {k:'telefone',l:'Telefone / WhatsApp',t:'tel'},
    {k:'email',l:'E-mail',t:'email',valid:v=>v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?'E-mail inválido.':''},
    {k:'assunto',l:'Assunto',t:'select',req:true,opts:ASSUNTOS},
    {k:'urgencia',l:'Urgência',t:'select',opts:URGENCIAS,hint:'Urgente: risco a pessoas, falta d’água geral, elevador com passageiro preso.'},
    {k:'local',l:'Onde está o problema?',ph:'Ex.: hall do 5º andar, garagem vaga 32, piscina',full:true},
    {k:'descricao',l:'Descreva o problema',t:'textarea',req:true,full:true,ph:'O que está acontecendo, desde quando, se piora com chuva…'},
    {k:'fotos',l:'Fotos (até 3)',t:'file',full:true}
  ];
  if(interno)c.splice(8,0,{k:'ativoId',l:'Ativo relacionado (opcional)',t:'select',full:true,opts:[{v:'',l:'— Não identificado —'},...opcoesAtivos()]});
  return c;
}
async function registrarSolicitacao(v,origem){
  const files=[...(v.fotos||[])].slice(0,3);delete v.fotos;
  const fotos=[];for(const f of files){try{fotos.push(await lerFoto(f));}catch(e){toast(e.message,true);}}
  const so={id:uid(),protocolo:await reservarNumero('seqSol','SOL'),criadoEm:agora(),status:'aberta',osId:'',resposta:'',motivo:'',resolvidoEm:'',ativoId:'',
    urgencia:'Normal',...v,fotos,historico:[{em:agora(),txt:origem==='morador'?'Registrada pelo morador':'Registrada pela administração'}]};
  S.solicitacoes.push(so);salvar();return so;
}
function novaSolicitacaoInterna(){

  abrirForm({titulo:'Nova solicitação do condômino',wide:true,campos:camposSolicitacao(true),dados:{urgencia:'Normal',assunto:ASSUNTOS[0],condominioId:condominios().length===1?condominios()[0].id:''},

function editarSolicitacao(id){

function gerarOS(id){
  const so=getSol(id);if(!so)return;
  if(!S.ativos.length){toast('Cadastre ativos antes de gerar a OS.',true);return;}
  const tipo=so.urgencia==='Urgente'?'Emergência':'Corretiva';
  const prio={Baixa:'Baixa',Normal:'Média',Alta:'Alta',Urgente:'Crítica'}[so.urgencia]||'Média';
  const dados={tipo,prioridade:prio,titulo:`${so.assunto} · ${so.unidade}`,ativoId:so.ativoId||so.condominioId,
    dataPrevista:so.urgencia==='Baixa'?addDias(hoje(),7):so.urgencia==='Normal'?addDias(hoje(),2):hoje(),
    status:tipo==='Emergência'?'andamento':'planejada',
    descricao:`Solicitação ${so.protocolo} · ${so.nome} (${so.unidade})${so.telefone?' · '+so.telefone:''}\nLocal: ${so.local||'não informado'}\n\n${so.descricao}`};
  abrirForm({titulo:`Gerar Ordem de Serviço · ${so.protocolo}`,wide:true,campos:camposTarefa(null),dados,botao:'Gerar OS',
    nota:'A OS entra na Visão Kanban. O andamento dela atualiza a solicitação automaticamente.',
    salvar:async v=>{
      const st=v.status||'planejada';delete v.status;const num=await reservarNumero('seqOS','OS');
      const t=novaTarefa({...v,origem:'Solicitação',solicitacaoId:so.id,numeroOS:num,status:st,
        historico:[{em:agora(),txt:`${num} gerada a partir da solicitação ${so.protocolo}`}]});
      if(st==='andamento'){t.iniciadoEm=agora();t.historico.push({em:t.iniciadoEm,txt:'Execução iniciada'});}
      so.osId=t.id;so.status='atendimento';if(!so.ativoId)so.ativoId=v.ativoId;
      so.historico.push({em:agora(),txt:`${num} gerada (${TIPOS[v.tipo].nome})`});
      salvar();render();toast(`${num} gerada e enviada ao Kanban`);
    }});
}
function abrirSolicitacao(id){
  const so=getSol(id);if(!so)return;
  const k=statusSol(so),t=so.osId?S.tarefas.find(y=>y.id===so.osId):null,c=getAtivo(so.condominioId);
  const at=(l,v)=>`<div><span>${l}</span><b>${esc(v||'—')}</b></div>`;
  const b=[];
  if(!t&&!['recusada','resolvida'].includes(k)){
    if(k==='aberta')b.push(['solAnalise','Iniciar análise','']);
    b.push(['solRecusar','Recusar','danger'],['solEncerrar','Resolver sem OS',''],['gerarOS','Gerar Ordem de Serviço','primary']);
  }

  v.innerHTML=`<div class="morador-wrap">
    ${moradorFeito?`<div class="panel pad" role="status"><p class="muted" style="margin:0">Solicitação registrada. Guarde o número do protocolo:</p><div class="protocolo">${esc(moradorFeito)}</div>

      <footer class="mf"><button type="submit" class="btn primary">Enviar solicitação</button></footer></form></div>`}
    <div class="panel"><form class="form" id="formConsulta" novalidate><header class="mh" style="position:static"><h3>Consultar protocolo</h3></header>
      <div class="grid"><label class="fld"><span>Protocolo</span><input name="protocolo" placeholder="SOL-${new Date().getFullYear()}-0001" value="${esc(moradorFeito||'')}"></label>
      <label class="fld"><span>Unidade</span><input name="unidade" placeholder="Ex.: Torre A · 502"></label></div>
      <div id="consultaRes" style="padding:0 18px"></div><footer class="mf"><button type="submit" class="btn">Consultar</button></footer></form></div>
  </div>`;
  const fm=$('#formMorador');
  if(fm)fm.addEventListener('submit',async e=>{
    e.preventDefault();const erro=$('.erro',fm);erro.textContent='';
    const vals=coletar(fm,campos);
    for(const f of campos){const x=vals[f.k];if(f.req&&!x){erro.textContent=`Preencha o campo “${f.l}”.`;return;}if(f.valid){const m=f.valid(x,vals);if(m){erro.textContent=m;return;}}}
    if(vals.fotos&&vals.fotos.length>3){erro.textContent='Envie no máximo 3 fotos.';return;}
    const bt=$('button[type=submit]',fm);bt.disabled=true;bt.textContent='Enviando…';
    try{
      const so=FIREBASE_CONFIG?await registrarSolicitacaoMorador(vals):await registrarSolicitacao(vals,'morador');
      moradorFeito=so.protocolo;renderMorador();window.scrollTo(0,0);
    }catch(err){erro.textContent='Não foi possível enviar a solicitação. Verifique a internet e tente de novo.';bt.disabled=false;bt.textContent='Enviar solicitação';}
  });
  $('#formConsulta').addEventListener('submit',async e=>{
    e.preventDefault();const f=e.target,pr=f.elements.protocolo.value.trim().toUpperCase(),un=norm(f.elements.unidade.value).replace(/\s/g,'');
    const out=$('#consultaRes');
    if(FIREBASE_CONFIG){
      if(!pr||!un){out.innerHTML='<p class="erro">Informe o protocolo e a unidade.</p>';return;}
      out.innerHTML='<p class="muted">Consultando…</p>';
      let c=null;try{c=(await comTempo(fbDb.ref(PUB_PATH+'/consulta/'+chaveConsulta(pr,f.elements.unidade.value)).once('value'),15000)).val();}
      catch(err){out.innerHTML='<p class="erro">Não foi possível consultar agora. Verifique a internet.</p>';return;}
      if(!c||!ST_SOL[c.status]){out.innerHTML='<p class="erro">Protocolo não encontrado para esta unidade.</p>';return;}
      out.innerHTML=`<p><span class="pill" style="--cc:var(${ST_SOL[c.status].c})">${ST_SOL[c.status].t}</span> <span class="muted">registrada em ${fmtDT(c.criadoEm)}</span></p>${c.resposta?`<b>Resposta da administração</b><div class="txt" style="white-space:pre-wrap;background:var(--surface-2);border-radius:6px;padding:10px 12px;margin:4px 0">${esc(c.resposta)}</div>`:'<p class="muted">Ainda sem resposta da administração.</p>'}`;
      return;
    }
    const so=S.solicitacoes.find(x=>x.protocolo===pr);
    if(!so||!un||norm(so.unidade).replace(/\s/g,'')!==un){out.innerHTML='<p class="erro">Protocolo não encontrado para esta unidade.</p>';return;}
    out.innerHTML=`<p>${pillSol(so)} <span class="muted">registrada em ${fmtDT(so.criadoEm)}</span></p>${so.resposta?`<b>Resposta da administração</b><div class="txt" style="white-space:pre-wrap;background:var(--surface-2);border-radius:6px;padding:10px 12px;margin:4px 0">${esc(so.resposta)}</div>`:'<p class="muted">Ainda sem resposta da administração.</p>'}`;
  });
}

const fecharMenu=()=>{const m=$('#menuDados');if(m)m.open=false;};
const fecharDropdowns=()=>$$('.dd-pop').forEach(p=>{p.hidden=true;p.parentElement.querySelector('.dd-btn')?.setAttribute('aria-expanded','false');});
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu'))fecharMenu();
  if(!e.target.closest('.dd'))fecharDropdowns();
  const tab=e.target.closest('.tab');if(tab){trocarAba(tab.dataset.tab);return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=ACOES[el.dataset.act];if(!fn)return;
  e.preventDefault();
  if(ACOES_ADMIN.has(el.dataset.act)&&!ehAdmin()){toast('O seu perfil (operador) não permite esta ação.',true);return;}
  fn(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('.overlay'))fecharModal();else{fecharMenu();fecharDropdowns();}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('card')){e.preventDefault();abrirTarefa(e.target.dataset.id);}
});
/* ---------------- Navegação ---------------- */
let aba='ativos';
const RENDER={ativos:renderAtivos,mapa:renderMapa,pmp:renderPMP,crono:renderCrono,dash:renderDash,sol:renderSol,kanban:renderKanban,forn:renderForn,usuarios:renderUsuarios};
function trocarAba(a){
  if(!RENDER[a]||(a==='usuarios'&&!ehSuper()))return;
  if(FIREBASE_CONFIG&&!appLiberado&&!MODO_MORADOR)return;
  aba=a;
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===a)));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+a));
  try{sessionStorage.setItem('om_aba',a);}catch(e){}
  if(location.hash!=='#'+a)history.replaceState(null,'','#'+a);
  render();
}
let moradorIniciado=false;
function render(){
  if(MODO_MORADOR){aplicarMarca();if(!moradorIniciado||(!$('#formConsulta'))){moradorIniciado=true;renderMorador();}return;}
  aplicarMarca();
  if(FIREBASE_CONFIG&&!appLiberado)return;
  RENDER[aba]();
  ajustarLayout();
  const ns=S.solicitacoes.filter(x=>['aberta','analise'].includes(statusSol(x))).length;$('#nSol').textContent=ns;$('#nSol').dataset.z=ns?'0':'1';
  const n=S.tarefas.filter(t=>t.status!=='concluida').length;$('#nKanban').textContent=n;$('#nKanban').dataset.z=n?'0':'1';
}

/* ---------------- Cabeçalho fixo e menu lateral ---------------- */
function ajustarLayout(){
  const r=document.documentElement.style,nav=$('#menuLateral'),f=$('main>.view.on .fixo');
  r.setProperty('--navh',(nav&&window.innerWidth<=900&&!document.body.classList.contains('bloqueado')?nav.offsetHeight:0)+'px');
  r.setProperty('--fixoh',(f?f.offsetHeight:0)+'px');
}
(function(){
  const h=$('header.top');
  const ajustar=()=>{document.documentElement.style.setProperty('--hdr',h.offsetHeight+'px');ajustarLayout();};
  ajustar();window.addEventListener('resize',ajustar);
  if(window.ResizeObserver)new ResizeObserver(ajustar).observe(h);
  try{if(localStorage.getItem('om_menu')==='recolhido')document.body.classList.add('menu-recolhido');}catch(e){}
  const bt=$('#btnRecolher');
  const rotulo=()=>{const r=document.body.classList.contains('menu-recolhido');bt.title=r?'Expandir menu':'Recolher menu';bt.setAttribute('aria-label',bt.title);$('.tl',bt).textContent=bt.title;};
  rotulo();
  bt.addEventListener('click',()=>{
    const r=document.body.classList.toggle('menu-recolhido');rotulo();
    try{localStorage.setItem('om_menu',r?'recolhido':'aberto');}catch(e){}
    setTimeout(()=>{if(mapa&&mapa.invalidateSize)mapa.invalidateSize();},260);
  });
})();

/* ---------------- Inicialização ---------------- */
(function(){
  if(MODO_MORADOR){
    document.body.classList.add('morador');document.title='Solicitação de manutenção · Condomínio';
    $('.brand h1').textContent='Solicitação de manutenção';$('.brand p').textContent='Registre problemas nas áreas comuns do condomínio';
    $$('.view').forEach(v=>v.classList.remove('on'));
    if(!FIREBASE_CONFIG)carregarLocal();
    iniciarMorador();return;
  }
  if(iniciarAcesso())return;             // com Firebase: login primeiro, dados depois
  carregarLocal();
  let a=(location.hash||'').slice(1);
  if(!RENDER[a]){try{a=sessionStorage.getItem('om_aba')||'';}catch(e){a='';}}
  if(!RENDER[a]||a==='usuarios')a=S.ativos.length?'kanban':'ativos';
  autoGerar();
  setSync('local');
  trocarAba(a);
})();
